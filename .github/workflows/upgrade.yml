name: profile upgrade check

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: Published version whose data should survive the upgrade
        required: true
        default: v0.1.0-beta.2
        type: string
  workflow_call:
    inputs:
      base_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  upgrade:
    name: previous release data survives upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build candidate embedded interface
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Verify profile upgrade with the released migrator
        env:
          UPGRADE_BASE_TAG: ${{ inputs.base_tag }}
        run: node scripts/check-upgrade.mjs
      - name: Upload upgrade result without profile data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/upgrade-report/result.json
          retention-days: 7
          if-no-files-found: warn
