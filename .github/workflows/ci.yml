name: ci

# Pure test/build workflow: no accounts, no release secrets. The R/P
# acceptance categories (real Codex, native installs) run separately and are
# never implied by this workflow.
on:
  workflow_call:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  repository-policy:
    name: repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check tracked public files and policy exceptions
        run: node scripts/check-public-files.mjs
      - name: Check pull request routing
        run: node scripts/check-pr-route.mjs
      - name: Test repository policy enforcement
        run: node --test scripts/repository-policy.test.mjs scripts/issue-commands.test.mjs scripts/check-docs.test.mjs scripts/check-upgrade.test.mjs scripts/live-test-plan.test.mjs
      - name: Test browser evidence sanitization
        run: python3 -m unittest discover -s scripts -p 'test_sanitize_test_evidence.py'
      - name: Check docs and UI message keys
        run: node scripts/check-docs.mjs
      - name: Test release input and artifact validation
        run: node --test scripts/release.test.mjs
      - name: Check the avatar catalog is built from its sources
        run: node assets/avatars/build.mjs --check
      - name: Validate and stage application icons
        run: node scripts/prepare-branding.mjs

  web-core:
    name: web/shared core (ubuntu)
    needs: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high --prefix frontend
      - name: gofmt
        run: |
          bad=$(gofmt -l cmd internal tests)
          if [ -n "$bad" ]; then echo "gofmt needed on:"; echo "$bad"; exit 1; fi
      - name: Generate contracts and check drift
        run: |
          ./scripts/generate.sh
          git diff --exit-code -- api/openapi.yaml internal/contract frontend/src/api/generated
          untracked=$(git status --porcelain -- api/openapi.yaml internal/contract frontend/src/api/generated | grep '^??' || true)
          if [ -n "$untracked" ]; then echo "generated contract files include untracked changes:"; echo "$untracked"; exit 1; fi
      - name: Frontend build (embedded assets, required before go build)
        run: npm run build --prefix frontend
      - name: Go vet and build
        run: |
          go vet ./...
          go build ./...
      - name: Go tests (unit + integration, temp data roots only)
        run: go test ./internal/... ./tests/...
      - name: Frontend typecheck and unit tests
        run: |
          npm run typecheck --prefix frontend
          npm test --prefix frontend
      - name: Rebuild with embedded assets
        run: go build ./...

  desktop-static:
    name: desktop shell static compile (windows)
    needs: repository-policy
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build embedded assets
        run: npm run build --prefix frontend
      - name: Compile desktop shell with desktop tag (static check only)
        run: go build -tags desktop -o .tmp/bin/check-cobot-desktop.exe ./cmd/cobot-desktop
      - name: Compile desktop development shell (includes Echo dev server)
        run: go build -tags desktop,dev -o .tmp/bin/check-cobot-desktop-dev.exe ./cmd/cobot-desktop

  browser-e2e:
    name: browser E2E (ubuntu, real core + fake engine)
    runs-on: ubuntu-latest
    needs: web-core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tests/e2e
      - name: Audit E2E dependencies
        run: npm audit --audit-level=high
        working-directory: tests/e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Run browser E2E specs
        id: browser-tests
        run: npx playwright test
        working-directory: tests/e2e
      - name: Collect synthetic workspace preview screenshots
        if: ${{ always() && steps.browser-tests.outcome != 'skipped' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          output = Path('tests/e2e/test-results/workspace-previews')
          for source in Path('.tmp/test-runs').glob('e2e-*/filesystem-*.png'):
              if source.is_symlink() or not source.is_file():
                  continue
              output.mkdir(parents=True, exist_ok=True)
              copyfile(source, output / (source.parent.name + '-' + source.name))
          PY
      - name: Upload synthetic workspace preview screenshots
        if: ${{ always() && steps.browser-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-previews-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/e2e/test-results/workspace-previews/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove temporary credentials from browser evidence
        id: sanitize-evidence
        if: ${{ failure() && steps.browser-tests.outcome == 'failure' }}
        run: python3 scripts/sanitize-test-evidence.py tests/e2e/test-results tests/e2e/playwright-report
      - name: Upload failed browser test evidence
        if: ${{ failure() && steps.browser-tests.outcome == 'failure' && steps.sanitize-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: warn
