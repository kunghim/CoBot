name: Feature request / 功能建议
description: Describe a problem and proposed improvement / 描述问题和改进建议
labels: [enhancement, "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese are welcome; one report is enough. You do not need a solution to describe a useful problem.
        欢迎中文和英文，无需重复提交双语副本；没有解决方案也可以提出问题。
        Discuss substantial changes here before opening a large PR.
        较大改动请先在 Issue 中讨论，再提交大型 PR。
  - type: dropdown
    id: discovery_source
    attributes:
      label: Discovery source / 发现来源
      description: Who identified the need? AI translation or editing alone does not count. / 谁发现了这个需求？仅由 AI 翻译或润色不算 AI 发现。
      options:
        - Human-discovered / 人工发现
        - AI-discovered / AI 发现
        - Unsure / 不确定
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 问题或使用场景
      description: What are you trying to achieve, and what gets in the way? / 想完成什么，目前遇到什么阻碍？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议的行为
      description: Optional. Describe an improvement if you have one. / 可选：如果有改进思路，请在此说明。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope / 替代方案与范围
      description: Optional workarounds, alternatives, and what should stay outside this change. / 可选：现有办法、替代方案和范围边界。
