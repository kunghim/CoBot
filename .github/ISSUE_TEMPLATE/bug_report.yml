name: Bug report / 问题反馈
description: Report a reproducible problem / 提交可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese are welcome. Search existing issues first.
        欢迎使用中文或英文，请先搜索已有 Issue。
        Do not post vulnerabilities, credentials, startup links, databases or raw traces.
        不要公开漏洞细节、凭据、启动链接、数据库或原始 trace；安全问题见 SECURITY.md。
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: CoBot version or commit, OS/architecture, Web or desktop, Codex version. For source builds, include Go and Node versions.
      placeholder: "CoBot: ...\nOS / architecture: ...\nWeb or desktop: ...\nCodex: ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Include the smallest reproduction and how often it happens. / 提供最小复现步骤和发生频率。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / 脱敏证据
      description: Optional screenshots or a short log excerpt. Remove tokens, cookies, private content and startup links. Never attach raw cobot trace recordings.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隐私
      options:
        - label: I removed secrets and private data from this report. / 已移除秘密和私人数据。
          required: true
