  const team = (id) => teams.find((t) => t.id === id);
  const member = (tid, bid) => team(tid).members.find((m) => m.id === bid);
  const botName = (tid, bid) => (bid === 'cap' ? '队长' : (member(tid, bid) ? ROLES[member(tid, bid).role].n : bid));
  const avChar = (tid, bid) => (bid === 'cap' ? '队' : (member(tid, bid) ? ROLES[member(tid, bid).role].a : '?'));
  const ownerA = (o) => (ROLES[o] ? ROLES[o].a : '队');
  const ownerN = (o) => (ROLES[o] ? ROLES[o].n : '队长');
  const threadsOf = (tid, bid) => bid === 'cap'
    ? team(tid).members.flatMap(m => (THREADS[tid + ':' + m.id] || []).filter(th => th.with === 'cap').map(th => ({with: m.id, msgs: th.msgs})))
    : THREADS[tid + ':' + bid] || [];
  const scopedTasks = t => (TASKS[t.id] || []).filter(x => S.bot === 'cap' || x.o === S.bot);
  const visibleApproval = a => a.team === S.team && (S.bot === 'cap' || a.from === S.bot);
  const panelButton = () => S.rightPanel ? '' : '<button type="button" class="cb-iconbtn" data-act="toggle-panel" aria-label="打开工作面板" title="打开工作面板" aria-expanded="false"><i data-lucide="panel-right" aria-hidden="true"></i></button>';
  const listButton = () => S.sideOpen ? '' : '<button type="button" class="cb-iconbtn" data-act="toggle-side" aria-label="展开团队列表" title="展开团队列表" aria-expanded="false"><i data-lucide="panel-left" aria-hidden="true"></i></button>';
  const pendingIds = (tid,bid) => Object.keys(AP).filter(id => !AP[id].chosen && AP[id].team===tid && (bid==='cap' || (AP[id].from===bid && AP[id].kind!=='rec')));
  const selectedPending = (tid,bid) => {
    const ids=pendingIds(tid,bid),key=tid+':'+bid;
    if(!ids.includes(S.pendingSelection[key]))S.pendingSelection[key]=ids[0]||null;
    return S.pendingSelection[key];
  };
  const dot = (st) => '<span class="cb-dot s-' + st + '" aria-hidden="true"></span><span class="sr">' + ST_LABEL[st] + '</span>';
  const teamPending = (tid) => Object.values(AP).filter((a) => a.team === tid && !a.chosen).length;
  const pendingTotal = () => Object.values(AP).filter((a) => !a.chosen).length;
  const statusChip = (st) => {
    const c = (st === 'run' || st === 'write') ? 'green' : (st === 'wait' || st === 'input') ? 'amber' : st === 'stop' ? 'red' : '';
    return '<span class="cb-chip ' + c + '">' + ST_LABEL[st] + '</span>';
  };
  const iconPaths = {
    'arrow-up':'M12 19V5 M5 12l7-7 7 7', 'plus':'M12 5v14 M5 12h14',
    'panel-left':'M3 3h18v18H3z M9 3v18', 'panel-right':'M3 3h18v18H3z M15 3v18', 'home':'M3 10l9-7 9 7 M5 9v12h5v-7h4v7h5V9', 'chevron-left':'M15 6l-6 6 6 6', 'chevron-down':'M6 9l6 6 6-6', 'chevron-right':'M9 6l6 6-6 6',
    'check':'M5 12l4 4L19 6', 'x':'M6 6l12 12 M6 18L18 6',
    'shield-check':'M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M8 12l3 3 5-6',
    'send':'M21 3L3 10l7 4 4 7 7-18z M10 14L21 3',
    'messages-square':'M3 3h15v12H8l-5 4V3z M18 7h3v14l-5-4h-5',
    'message-square':'M3 3h18v14H8l-5 4V3z',
    'columns-3':'M3 3h18v18H3z M9 3v18 M15 3v18',
    'inbox':'M3 3h18v18H3z M3 12h5l2 3h4l2-3h5',
    'settings':'M12 3v3 M12 18v3 M3 12h3 M18 12h3 M6 6l2 2 M16 16l2 2 M6 18l2-2 M16 8l2-2 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8',
    'folder-check':'M3 5h6l2 2h10v14H3z M8 14l3 3 6-6'
  };
  const icons = () => root.querySelectorAll('i[data-lucide]').forEach(el => {
    const d=iconPaths[el.dataset.lucide] || 'M4 12h16 M12 4v16';
    el.outerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="'+d+'"/></svg>';
  });


  function taskFlag(x) {
    if (x.id === 12 && x.s === 'doing' && !AP.a1.chosen) return ['等你审批', 'amber'];
    if (x.id === 7 && AP.r1.chosen) return null;
    if (x.block) return [x.block, 'red'];
    if (x.dep) return [x.dep, ''];
    return null;
  }

  function memberSub(t, m) {
    const x = (TASKS[t.id] || []).find(k => k.o === m.role && k.s !== 'done');
    return x ? '当前任务 #' + x.id + ' ' + esc(x.t) : '暂无任务';
  }

  function statusBar(tid) {
    const t = team(tid);
    const parts = [];
    for (const m of t.members.filter(m => S.bot === 'cap' || m.id === S.bot)) {
      if (['run', 'write', 'input'].includes(m.st)) {
        parts.push('<span class="cb-dot s-' + m.st + '" aria-hidden="true"></span>' + ROLES[m.role].n + ' ' + (m.st === 'write' ? '正在写回复…' : ST_LABEL[m.st]));
      }
    }
    return parts.join('<span class="cb-sep">·</span>');
  }

  function renderSide() {
    const pend = pendingTotal();
    let h = '<div class="cb-brand"><span class="cb-logo" aria-hidden="true">co</span><span class="cb-brand-name">cobot</span><button type="button" class="cb-iconbtn cb-collapse-list" data-act="toggle-side" aria-label="收起团队列表" title="收起团队列表" aria-expanded="true"><i data-lucide="panel-left" aria-hidden="true"></i></button></div>' +
      '<button type="button" class="cb-newbtn" data-act="new-team"><i data-lucide="plus" aria-hidden="true"></i><span>新建团队</span></button>' +
      '<button type="button" class="cb-navbtn" data-act="goto-pending"><i data-lucide="shield-check" aria-hidden="true"></i><span>待你处理</span>' + (pend ? '<span class="cb-badge amber">' + pend + '</span>' : '') + '</button>' +
      '<div class="cb-sec">团队</div><ul class="cb-tree">';
    for (const t of teams) {
      const exp = !!S.expanded[t.id];
      const sel = S.team === t.id && S.bot === 'cap' && S.mode === 'chat';
      const tp = teamPending(t.id);
      const badge = tp ? '<span class="cb-badge ' + (Object.values(AP).some((a) => a.kind === 'rec' && a.team === t.id && !a.chosen) ? 'red' : 'amber') + '">' + tp + '</span>'
        : (t.unread && !S.seen[t.id] ? '<span class="cb-badge">' + t.unread + '</span>' : '');
      h += '<li><div class="cb-row cap' + (sel ? ' sel' : '') + '">' +
        '<button type="button" class="cb-chev" data-act="toggle" data-team="' + t.id + '" aria-expanded="' + exp + '" aria-label="' + (exp ? '收起' : '展开') + esc(t.name) + '的成员"><i data-lucide="' + (exp ? 'chevron-down' : 'chevron-right') + '" aria-hidden="true"></i></button>' +
        '<button type="button" class="cb-open" data-act="open" data-team="' + t.id + '" data-bot="cap">' +
        '<span class="cb-av cap">' + esc(t.name.slice(0, 1).toUpperCase()) + '</span>' +
        '<span class="cb-label"><span class="cb-l1">' + esc(t.name) + '</span><span class="cb-l2"><span class="cb-role">队长</span>' + '</span></span>' +
        dot(t.cap.st) + badge + '</button></div>';
      if (exp) {
        h += '<ul class="cb-members">';
        for (const m of t.members) {
          const msel = S.team === t.id && S.bot === m.id && S.mode === 'chat';
          h += '<li><button type="button" class="cb-row mem' + (msel ? ' sel' : '') + '" data-act="open" data-team="' + t.id + '" data-bot="' + m.id + '">' +
            '<span class="cb-av sm">' + ROLES[m.role].a + '</span><span class="cb-label"><span class="cb-l1">' + ROLES[m.role].n + '</span></span>' + dot(m.st) + '</button>';
          h += '</li>';
        }
        h += '</ul>';
      }
      h += '</li>';
    }
    h += '</ul>';
    side.innerHTML = h;
  }

  function cardHead(a, navigation = '') {
    const k = KIND[a.kind];
    return '<div class="cb-card-h"><span class="cb-tag ' + k[1] + '">' + k[0] + '</span><span>' + botName(a.team, a.from) + '</span><span class="cb-time">' + esc(a.time) + '</span>' + navigation + '</div>';
  }

  function cardBody(a) {
    if (a.kind === 'rec') return '<div class="cb-card-t">这一轮中断了：' + esc(a.title) + '</div><div class="cb-card-t">任务分支<code>' + esc(a.code) + '</code></div>';
    return '<div class="cb-card-t">' + esc(a.title) + '<code>' + esc(a.code) + '</code></div>';
  }

  function pendCard(id) {
    const a=AP[id],k=KIND[a.kind],ids=pendingIds(S.team,S.bot),index=ids.indexOf(id);
    const nav='<div class="cb-cardpager" role="group" aria-label="审批卡翻页"><button type="button" class="cb-iconbtn" data-act="page-approval" data-delta="-1" aria-label="上一张审批卡" title="上一张"'+(index===0?' disabled':'')+'><i data-lucide="chevron-left" aria-hidden="true"></i></button><span class="cb-pagecount" aria-live="polite">'+(index+1)+' / '+ids.length+'</span><button type="button" class="cb-iconbtn" data-act="page-approval" data-delta="1" aria-label="下一张审批卡" title="下一张"'+(index===ids.length-1?' disabled':'')+'><i data-lucide="chevron-right" aria-hidden="true"></i></button></div>';
    const btns=OPTS[a.kind].map((o,i)=>'<button type="button" class="cb-btn'+(i===0?' pri':(NEG[o[0]]?' ghost':''))+'" data-act="ap" data-id="'+id+'" data-v="'+o[0]+'">'+o[1]+'</button>').join('');
    return '<div class="cb-card '+k[2]+'" data-pending-id="'+id+'" role="group" aria-label="'+k[0]+'">'+cardHead(a,nav)+cardBody(a)+'<div class="cb-card-r">理由：'+esc(a.reason)+'</div><div class="cb-card-b">'+btns+'</div></div>';
  }

  function histCard(id) {
    const a = AP[id];
    const k = KIND[a.kind];
    const opts = OPTS[a.kind].map((o) => {
      const on = o[0] === a.chosen;
      return '<span class="cb-opt' + (on ? ' on' + (NEG[o[0]] ? ' neg' : '') : '') + '">' + (on ? '<i data-lucide="check" aria-hidden="true"></i><span class="sr">已选：</span>' : '') + o[1] + '</span>';
    }).join('');
    return '<div class="cb-card hist" role="group" aria-label="' + k[0] + '记录">' + cardHead(a) + cardBody(a) +
      '<div class="cb-card-r">理由：' + esc(a.reason) + '</div><div class="cb-opts" aria-label="当时的选项">' + opts + '</div>' +
      '<div class="cb-card-foot">在' + esc(a.where) + '处理 · ' + esc(a.doneAt) + '</div></div>';
  }

  function renderStream(tid, bid) {
    const items = CONV[tid + ':' + bid] || [];
    let o = '<div class="cb-stream">';
    for (const it of items) {
      if (it.k === 'user') o += '<div class="cb-msg me"><div class="cb-bubble">' + esc(it.x) + '</div></div>';
      else if (it.k === 'bot') o += '<div class="cb-msg"><span class="cb-av sm' + (it.who === 'cap' ? ' cap' : '') + '">' + avChar(tid, it.who) + '</span><div><div class="cb-from">' + botName(tid, it.who) + '<span class="cb-time">' + (it.time || '') + '</span></div><div class="cb-bubble bot">' + esc(it.x) + '</div></div></div>';
      else if (it.k === 'pill') {
        o += '<div class="cb-pill-wrap">' + (it.act
          ? '<button type="button" class="cb-pill link" data-act="' + it.act + '" data-team="' + tid + '" data-bot="' + it.bot + '" data-with="' + it.with + '"><i data-lucide="' + it.icon + '" aria-hidden="true"></i>' + esc(it.x) + '</button>'
          : '<span class="cb-pill"><i data-lucide="' + (it.icon || 'arrow-right-left') + '" aria-hidden="true"></i>' + esc(it.x) + '</span>') + '</div>';
      }
    }
    if (!items.length) o += '<div class="cb-empty">还没有消息</div>';
    o += '</div>';
    const current=selectedPending(tid,bid);
    if(current)o+='<div class="cb-dock" aria-label="待审批卡">'+pendCard(current)+'</div>';
    const sb = statusBar(tid);
    if (sb) o += '<div class="cb-statusbar">' + sb + '</div>';
    o += '<form class="cb-composer" data-act="send"><textarea rows="1" aria-label="消息" placeholder="给' + botName(tid, bid) + '发消息…"></textarea><button type="submit" class="cb-send" aria-label="发送"><i data-lucide="arrow-up" aria-hidden="true"></i></button></form>';
    return o;
  }


  function renderMemory(tid, bid) {
    const list = MEM[tid + ':' + bid] || [];
    return '<div class="cb-stream"><div class="cb-note">只记工作方法和偏好，按团队隔离，可以删除。</div>' +
      (list.map((f) => '<div class="cb-fact"><span>' + esc(f[0]) + '</span><span class="cb-time">' + f[1] + '</span></div>').join('') || '<div class="cb-empty">还没有记忆</div>') + '</div>';
  }


  function taskCard(x) {
    const f = taskFlag(x);
    return '<div class="cb-task' + (f && f[1] === 'red' ? ' blocked' : '') + '"><div class="cb-task-t"><span class="cb-tid">#' + x.id + '</span>' + esc(x.t) + '</div>' +
      '<div class="cb-task-o"><span class="cb-av xs">' + ownerA(x.o) + '</span>' + ownerN(x.o) + '</div>' +
      '<div class="cb-task-d">完成标准：' + esc(x.dod) + '</div>' + (x.ev ? '<div class="cb-task-e">证据：' + esc(x.ev) + '</div>' : '') +
      (f ? '<div class="cb-task-f ' + f[1] + '">' + esc(f[0]) + '</div>' : '') + '</div>';
  }

  function renderBoard() {
    const t = team(S.team);
    const ts = scopedTasks(t);
    const cols = [['todo', '待办'], ['doing', '进行中'], ['review', '待审查'], ['done', '完成']];
    let o = '<header class="cb-head"><div class="cb-who">' + listButton() + '<button type="button" class="cb-iconbtn" data-act="back-board" aria-label="返回会话"><i data-lucide="arrow-left" aria-hidden="true"></i></button><div class="cb-who-t"><div class="cb-name">任务板<span class="cb-team"> · ' + esc(t.name) + '</span></div><div class="cb-sub">只有队长能建任务和指派；成员可以更新自己的任务、提交证据、转交</div></div></div>' + panelButton() + '</header><div class="cb-board">';
    for (const [k, label] of cols) {
      const list = ts.filter((x) => x.s === k);
      o += '<section class="cb-col" aria-label="' + label + '"><div class="cb-col-h">' + label + '<span class="cb-meta">' + list.length + '</span></div>' + list.map(taskCard).join('') + '</section>';
    }
    main.innerHTML = o + '</div>';
  }

  function renderMain() {
    if (S.mode === 'board') { renderBoard(); return; }
    const t = team(S.team), isCap = S.bot === 'cap';
    const m = isCap ? null : member(t.id, S.bot), st = isCap ? t.cap.st : m.st;
    const sub = isCap ? esc(t.dir) : memberSub(t, m);
    main.innerHTML = '<header class="cb-head"><div class="cb-who">' + listButton() + '<span class="cb-av' + (isCap ? ' cap' : '') + '">' + avChar(t.id, S.bot) + '</span><div class="cb-who-t"><div class="cb-name">' + botName(t.id, S.bot) + '<span class="cb-team"> · ' + esc(t.name) + '</span>' + statusChip(st) + '</div><div class="cb-sub">' + sub + '</div></div></div>' + panelButton() + '</header>' + renderStream(t.id, S.bot);
  }

  function rTasks(t) {
    const ts = scopedTasks(t);
    const groups = [['doing', '进行中'], ['review', '待审查'], ['todo', '待办'], ['done', '完成']];
    let o = S.mode === 'board'
      ? '<button type="button" class="cb-btn" data-act="back-board"><i data-lucide="message-square" aria-hidden="true"></i>收起看板，回到会话</button>'
      : '<button type="button" class="cb-btn" data-act="board"><i data-lucide="columns-3" aria-hidden="true"></i>展开看板</button>';
    for (const [k, l] of groups) {
      const list = ts.filter((x) => x.s === k);
      if (!list.length) continue;
      o += '<div class="cb-rgroup">' + l + ' ' + list.length + '</div>';
      for (const x of list) {
        const f = taskFlag(x);
        o += '<div class="cb-rtask"><div class="cb-rtask-top"><span class="cb-tid">#' + x.id + '</span><span class="cb-l1">' + esc(x.t) + '</span></div><div class="cb-task-o"><span class="cb-av xs">' + ownerA(x.o) + '</span>' + ownerN(x.o) + (f ? '<span class="cb-task-f ' + f[1] + '">· ' + esc(f[0]) + '</span>' : '') + '</div></div>';
      }
    }
    if (!ts.length) o += '<div class="cb-empty">还没有任务。把需求发给队长，它会拆成任务。</div>';
    return o;
  }

  function rApprovals(t) {
    const hist=HIST.filter(id=>visibleApproval(AP[id]) && AP[id].chosen).slice().reverse();
    return '<div class="cb-note">'+(S.bot==='cap'?'全团队已处理的审批':'当前成员已处理的审批')+'</div>'+(hist.length?hist.map(histCard).join(''):'<div class="cb-empty">还没有审批记录</div>');
  }

  function rActivity(t) {
    const list = (ACT[t.id] || []).filter(a => S.bot === 'cap' || (a[2] || []).includes(S.bot)).slice().reverse();
    return '<div class="cb-note">' + (S.bot === 'cap' ? '全团队事件' : botName(t.id, S.bot) + '相关事件') + '</div>' + (list.map(a => '<div class="cb-act"><time>' + esc(a[0]) + '</time><span>' + esc(a[1]) + '</span></div>').join('') || '<div class="cb-empty">暂无相关动态</div>');
  }

  function rCollaboration(t) {
    const ths = threadsOf(t.id, S.bot);
    if (!S.thread) return '<div class="cb-note">协作记录 · 当前 bot 与同团队成员的工作沟通。只读，结论写回任务。</div>' + (ths.map(th => '<button type="button" class="cb-thread" data-act="thread" data-team="' + t.id + '" data-bot="' + S.bot + '" data-with="' + th.with + '"><span class="cb-av sm">' + avChar(t.id, th.with) + '</span><span class="cb-label"><span class="cb-l1">与' + botName(t.id, th.with) + '</span><span class="cb-l2">' + esc(th.msgs[th.msgs.length-1].x) + '</span></span><span class="cb-meta">' + th.msgs.length + ' 条</span></button>').join('') || '<div class="cb-empty">暂无协作记录</div>');
    const th = ths.find(x => x.with === S.thread);
    if (!th) { S.thread = null; return rCollaboration(t); }
    return '<button type="button" class="cb-btn" data-act="back">返回协作记录</button><div class="cb-note">' + botName(t.id,S.bot) + ' ⇄ ' + botName(t.id,S.thread) + ' · 只读</div>' + th.msgs.map(m => '<div class="cb-fact"><div><strong>' + botName(t.id,m.from) + '</strong><span class="cb-time"> ' + esc(m.time) + '</span><p style="margin:6px 0 0">' + esc(m.x) + '</p></div></div>').join('');
  }

  function renderRight() {
    app.dataset.rp = S.rightPanel ? 'on' : 'off';
    const t = team(S.team);
    const tp = Object.values(AP).filter(a => visibleApproval(a) && !a.chosen).length;
    const tabs = [['tasks','任务'],['approvals','审批'],['activity','动态'],['collaboration','协作'],['memory','记忆']];
    let o = '<div class="cb-panelhead"><div><strong>' + botName(t.id,S.bot) + '</strong><div class="cb-l2">' + (S.bot === 'cap' ? '全团队任务与进展' : '当前成员的工作') + '</div></div><button type="button" class="cb-iconbtn" data-act="toggle-panel" aria-label="收起工作面板" title="收起工作面板" aria-expanded="true"><i data-lucide="panel-right" aria-hidden="true"></i></button></div><div class="cb-rtabs" role="tablist" aria-label="工作面板">' + tabs.map(p => '<button type="button" role="tab" class="cb-rtab" aria-selected="' + (S.rp===p[0]) + '" data-act="rp" data-v="' + p[0] + '">' + p[1]  + '</button>').join('') + '</div><div class="cb-rbody">';
    if (S.rp==='tasks') o += rTasks(t);
    else if (S.rp==='approvals') o += rApprovals(t);
    else if (S.rp==='activity') o += rActivity(t);
    else if (S.rp==='collaboration') o += rCollaboration(t);
    else o += renderMemory(t.id,S.bot);
    right.innerHTML = o + '</div>';
  }

  function renderRail() {
    app.dataset.side=S.sideOpen?'on':'off';
    rail.innerHTML='<span class="cb-rail-logo" aria-label="cobot">co</span><button type="button" class="cb-railbtn active" data-act="home" aria-label="首页" title="首页" aria-current="page"><i data-lucide="home" aria-hidden="true"></i></button><div class="cb-rail-bottom"><button type="button" class="cb-railbtn" data-act="settings" aria-label="设置" title="设置"><i data-lucide="settings" aria-hidden="true"></i></button></div>';
  }
  function renderAll() { renderRail(); renderSide(); renderMain(); renderRight(); icons(); }

  function where() {
    if (S.mode === 'chat') return S.bot === 'cap' ? '队长会话' : botName(S.team, S.bot) + '的会话';
    return '团队面板';
  }

  function resolveAp(id, v, inRight) {
    const a = AP[id];
    if (!a || a.chosen) return;
    const opt = OPTS[a.kind].find((o) => o[0] === v);
    if (!opt) return;
    const ids=pendingIds(S.team,S.bot),oldIndex=ids.indexOf(id),key=S.team+':'+S.bot;
    a.chosen = v;
    const remaining=pendingIds(S.team,S.bot);
    S.pendingSelection[key]=remaining[Math.min(Math.max(oldIndex,0),remaining.length-1)]||null;
    a.doneAt = '刚刚';
    a.where = inRight ? botName(S.team, S.bot) + '的工作面板' : where();
    HIST.push(id);
    if (id === 'a1') member('cobot', 'be').st = v === 'deny' ? 'idle' : 'run';
    if (id === 'a2') { if (v === 'stop') member('cobot', 'fe').st = 'idle'; S.chain = v === 'stop' ? '已停止' : '0/10'; }
    if (id === 'r1') member('market', 'qa').st = v === 'drop' ? 'idle' : 'run';
    (ACT[a.team] = ACT[a.team] || []).push(['刚刚', botName(a.team,a.from) + ' ' + KIND[a.kind][0] + '：' + opt[1], [a.from]]);
    live.textContent = KIND[a.kind][0] + '：' + opt[1] + '。卡片已从输入框上方移除，记录保存在审批页。';
    renderAll();
  }

  const norm = (p) => p.trim().replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase();

  function validate() {
    const dirEl = modal.querySelector('#cb-f-dir');
    const nameEl = modal.querySelector('#cb-f-name');
    const hint = modal.querySelector('#cb-f-hint');
    const btn = modal.querySelector('#cb-f-create');
    if (!dirEl || !nameEl || !hint || !btn) return;
    const d = norm(dirEl.value);
    let err = '';
    if (!d) err = '请选择工作目录。';
    else {
      for (const t of teams) {
        const td = norm(t.dir);
        if (d === td) { err = '这个目录已属于团队「' + t.name + '」。一个目录只能有一个团队。'; break; }
        if (d.startsWith(td + '/') || td.startsWith(d + '/')) { err = '这个目录和团队「' + t.name + '」的目录相互嵌套，不能创建。'; break; }
      }
    }
    hint.className = 'cb-hint ' + (err ? 'err' : 'ok');
    if (err) hint.setAttribute('role', 'alert'); else hint.removeAttribute('role');
    hint.textContent = err || '目录可用，创建后会绑定到这个团队。';
    btn.disabled = !!err || !nameEl.value.trim();
  }

  function openModal() {
    const roles = Object.keys(ROLES).map((k) => '<label class="cb-role-opt"><input type="checkbox" value="' + k + '"' + (['fe', 'be', 'qa'].includes(k) ? ' checked' : '') + '><span class="cb-av xs">' + ROLES[k].a + '</span>' + ROLES[k].n + '</label>').join('');
    modal.innerHTML = '<div class="cb-dialog" role="dialog" aria-modal="true" aria-labelledby="cb-dlg-t">' +
      '<div class="cb-dlg-h"><h3 id="cb-dlg-t">新建团队</h3><button type="button" class="cb-iconbtn" data-act="close-modal" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div>' +
      '<label class="cb-field"><span>团队名称</span><input class="cb-input" id="cb-f-name" value="cobot-docs" autocomplete="off"></label>' +
      '<div class="cb-field"><span>工作目录</span><div class="cb-inrow"><input class="cb-input" id="cb-f-dir" value="~/code/cobot" autocomplete="off" aria-label="工作目录"><button type="button" class="cb-btn" data-act="noop">选择…</button></div></div>' +
      '<div class="cb-hint" id="cb-f-hint" aria-live="polite"></div>' +
      '<div class="cb-field"><span>队长</span><div class="cb-capline"><span class="cb-av sm cap">队</span>创建后自动产生，负责拆任务和派活</div></div>' +
      '<fieldset class="cb-field cb-roles"><legend>成员（之后也可以随时引入）</legend>' + roles + '</fieldset>' +
      '<div class="cb-dlg-f"><button type="button" class="cb-btn ghost" data-act="close-modal">取消</button><button type="button" class="cb-btn pri" id="cb-f-create" data-act="create">创建团队</button></div></div>';
    modal.hidden = false;
    validate();
    icons();
  }

  function closeModal() { modal.hidden = true; modal.innerHTML = ''; }

  function createTeam() {
    const name = modal.querySelector('#cb-f-name').value.trim();
    const dir = modal.querySelector('#cb-f-dir').value.trim();
    const limit = 6;
    const roles = Array.from(modal.querySelectorAll('.cb-role-opt input:checked')).map((i) => i.value);
    const id = 't' + (teams.length + 1);
    const names = roles.map((r) => ROLES[r].n).join('、') || '暂无';
    teams.push({ id: id, name: name, dir: dir, limit: limit, cap: { st: 'idle' }, members: roles.map((r) => ({ id: r, role: r, st: 'idle' })) });
    CONV[id + ':cap'] = [
      { k: 'pill', icon: 'folder-check', x: '团队已创建，目录绑定完成' },
      { k: 'bot', who: 'cap', time: '刚刚', x: '团队「' + name + '」建好了，成员：' + names + '。把第一项需求发给我吧。' }
    ];
    TASKS[id] = [];
    ACT[id] = [['刚刚', '创建团队，成员：' + names]];
    S.team=id;S.bot='cap';S.mode='chat';S.thread=null;S.sideOpen=true;S.expanded[id]=true;
    closeModal();
    renderAll();
    live.textContent = '已创建团队' + name;
  }

  root.addEventListener('click', (e) => {
    if (e.target === modal) { closeModal(); return; }
    const b = e.target.closest('[data-act]');
    if (!b || !root.contains(b) || b.tagName === 'FORM') return;
    const act = b.dataset.act;
    if (act === 'toggle') { S.expanded[b.dataset.team] = !S.expanded[b.dataset.team]; renderSide(); icons(); }
    else if (act === 'open') { S.team = b.dataset.team; S.bot = b.dataset.bot; S.mode = 'chat'; S.thread = null; S.seen[S.team] = true; S.expanded[S.team] = true; renderAll(); }
    else if (act === 'thread') { S.team = b.dataset.team; S.bot = b.dataset.bot; S.thread = b.dataset.with; S.mode = 'chat'; S.rp='collaboration'; S.rightPanel=true; S.expanded[S.team] = true; renderAll(); }
    else if (act === 'back') { S.thread=null; renderAll(); }
    else if (act === 'rp') { S.rp=b.dataset.v; S.thread=null; renderRight(); icons(); }
    else if (act === 'toggle-panel') { S.rightPanel=!S.rightPanel; renderAll(); }
    else if (act === 'board') { S.mode = 'board'; renderAll(); }
    else if (act === 'back-board') { S.mode = 'chat'; renderAll(); }
    else if (act === 'goto-pending') {
      const withPending = teams.find((t) => teamPending(t.id) > 0);
      S.team = withPending ? withPending.id : 'cobot'; S.bot = 'cap'; S.mode = 'chat'; S.thread=null; S.expanded[S.team] = true; renderAll();
    }
    else if (act === 'ap') resolveAp(b.dataset.id, b.dataset.v, !!b.closest('.cb-right'));
    else if (act === 'toggle-side') { S.sideOpen=!S.sideOpen; renderAll(); }
    else if (act === 'home') { S.mode='chat'; renderAll(); }
    else if (act === 'page-approval') {
      const ids=pendingIds(S.team,S.bot),current=selectedPending(S.team,S.bot),i=ids.indexOf(current)+Number(b.dataset.delta);
      if(i>=0 && i<ids.length){S.pendingSelection[S.team+':'+S.bot]=ids[i];renderMain();icons();}
    }
    else if (act === 'settings') {
      modal.innerHTML='<div class="cb-dialog" role="dialog" aria-modal="true" aria-labelledby="cb-settings-title"><div class="cb-dlg-h"><h3 id="cb-settings-title">设置</h3><button type="button" class="cb-iconbtn" data-act="close-modal" aria-label="关闭设置" title="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div><div class="cb-note">本次草案聚焦首页，设置内容留待后续设计。</div></div>';modal.hidden=false;icons();
    }
    else if (act === 'new-team') openModal();
    else if (act === 'close-modal') closeModal();
    else if (act === 'create') { if (!b.disabled) createTeam(); }
  });

  root.addEventListener('submit', (e) => {
    const f = e.target.closest('form');
    if (!f || !root.contains(f)) return;
    e.preventDefault();
    const ta = f.querySelector('textarea');
    const v = ta ? ta.value.trim() : '';
    if (!v) return;
    const key = S.team + ':' + S.bot;
    (CONV[key] = CONV[key] || []).push({ k: 'user', x: v });
    renderMain();
    icons();
  });

  root.addEventListener('input', (e) => { if (modal.contains(e.target)) validate(); });
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });

  renderAll();

})();
</script>
</div>
</body></html>
