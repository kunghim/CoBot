openapi: 3.0.3
info:
  title: CoBot local API
  version: "0.1.0"
  description: >
    Public wire contract of the loopback CoBot core. Success responses are
    {data, requestId}; errors are {error:{code,messageKey,params}, requestId}.
    Bot-scoped MCP traffic uses separate /internal/v1 routes and is not part
    of this document.
servers:
  - url: http://127.0.0.1:0
paths:
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Environment, capability and authorization status (anonymous readable)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Status"
  /api/v1/session/bootstrap:
    post:
      operationId: exchangeBootstrap
      summary: Exchange a one-time startup secret for a page session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, secret]
              properties:
                requestId: { type: string, format: uuid }
                secret: { type: string }
      responses:
        "200":
          description: Session established (sets HttpOnly session + CSRF cookies)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BootstrapResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Business settings of this profile
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      summary: Update business settings with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, patch]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, format: int64 }
                patch:
                  $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/snapshot:
    get:
      operationId: getSnapshot
      summary: Consistent read of visible entities plus the event cursor
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Snapshot"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Durable event stream (fetch SSE) after a cursor
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64 }
        - name: teamId
          in: query
          schema: { type: string }
        - name: botId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of cobot.event frames
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/engine:
    get:
      operationId: getEngine
      summary: Non-secret Codex engine status for this profile
      responses:
        "200":
          description: Engine status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineStatus"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: engineLogin
      summary: Start the official Codex login flow (engine auth, not page bootstrap)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "202":
          description: Login flow started; completion arrives via events
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login/cancel:
    post:
      operationId: engineLoginCancel
      summary: Cancel a pending Codex login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Login cancelled
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: engineLogout
      summary: End the engine (Codex) session for this profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Engine session ended
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/models:
    get:
      operationId: listModels
      summary: Engine-provided model list (non-secret)
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          models:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/session/logout:
    post:
      operationId: sessionLogout
      summary: End the current page session
      responses:
        "200":
          description: Logged out
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: Built-in role library
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string }
                                nameKey: { type: string }
                                name: { type: string }
                                contentVersion: { type: string }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/teams:
    get:
      operationId: listTeams
      summary: Teams with their members
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/TeamWithBots"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTeam
      summary: Create a team bound to one working directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, name, directory]
              properties:
                requestId: { type: string, format: uuid }
                name: { type: string }
                directory: { type: string }
                initialRoleIds:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Team created (staged, then activated)
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}:
    get:
      operationId: getTeam
      summary: One team with members
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TeamWithBots" }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/bots:
    post:
      operationId: addBot
      summary: Add one member of an existing role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, roleId]
              properties:
                requestId: { type: string, format: uuid }
                roleId: { type: string }
      responses:
        "201":
          description: Member added
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/directory/rebuild-marker:
    post:
      operationId: rebuildTeamMarker
      summary: Recreate the .cobot identification marker and report losses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Marker rebuilt
  /api/v1/bots/{id}/messages:
    get:
      operationId: listMessages
      summary: Conversation history of one bot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: before
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Messages plus queue state
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: sendMessage
      summary: Send a user message (persisted and queued; answered with 202)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, text]
              properties:
                requestId: { type: string, format: uuid }
                text: { type: string }
      responses:
        "202":
          description: Message persisted and queued
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/messages/{id}/cancel:
    post:
      operationId: cancelMessage
      summary: Cancel a queued (not yet dispatched) user message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Message cancelled
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/runs/{id}/interrupt:
    post:
      operationId: interruptRun
      summary: Request an engine-side stop of one run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "202":
          description: Interrupt requested; final state arrives via events
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/approvals:
    get:
      operationId: listApprovals
      summary: Pending cards (oldest first) or decided history
      parameters:
        - name: teamId
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [pending, history] }
        - name: requesterBotId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Approvals
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/approvals/{id}/decisions:
    post:
      operationId: decideApproval
      summary: Decide once (CAS); response delivery is tracked separately
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, optionId]
              properties:
                requestId: { type: string, format: uuid }
                optionId: { type: string }
                comment: { type: string }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: Decided approval (with responseState)
        "409":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Envelope:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, messageKey]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - idempotency_conflict
                - revision_conflict
                - capability_missing
                - engine_unavailable
                - internal
            messageKey: { type: string }
            params:
              type: object
              additionalProperties: true
        requestId: { type: string }
    EngineStatus:
      type: object
      required: [status, loggedIn]
      properties:
        status:
          type: string
          enum: [not_configured, ready, error, starting]
        binaryPath: { type: string }
        version: { type: string }
        protocol: { type: string }
        loggedIn: { type: boolean }
        capabilities:
          type: array
          items: { type: string }
        errorKey: { type: string }
    Status:
      type: object
      required:
        [product, version, profile, environment, dataRoot, endpoint, instanceId, serviceEpoch, startedAt, authorized, engine]
      properties:
        product: { type: string }
        version: { type: string }
        profile: { type: string, enum: [development, production] }
        environment: { type: string, enum: [development, production] }
        dataRoot: { type: string }
        endpoint: { type: string }
        instanceId: { type: string }
        serviceEpoch: { type: string }
        startedAt: { type: string, format: date-time }
        authorized: { type: boolean }
        engine: { $ref: "#/components/schemas/EngineStatus" }
    BootstrapResult:
      type: object
      required: [sessionExpiresAt, userId]
      properties:
        sessionExpiresAt: { type: string, format: date-time }
        userId: { type: string }
        bearerToken:
          type: string
          description: Desktop-shell bearer (30 min, renewable); browser flow ignores it
        bearerExpiresAt: { type: string, format: date-time }
    Settings:
      type: object
      required:
        [revision, language, defaultModel, evalModel, memberLimit, chainLimit, budgetScope, budgetTokens, enginePath]
      properties:
        revision: { type: integer, format: int64 }
        language: { type: string, enum: [zh-CN, en] }
        defaultModel: { type: string }
        evalModel: { type: string }
        memberLimit: { type: integer }
        chainLimit: { type: integer }
        budgetScope: { type: string, enum: ["", bot, team] }
        budgetTokens: { type: integer, format: int64 }
        enginePath: { type: string }
    SettingsPatch:
      type: object
      properties:
        language: { type: string, enum: [zh-CN, en] }
        defaultModel: { type: string }
        evalModel: { type: string }
        memberLimit: { type: integer }
        chainLimit: { type: integer }
        budgetScope: { type: string, enum: ["", bot, team] }
        budgetTokens: { type: integer, format: int64 }
        enginePath: { type: string }
    Snapshot:
      type: object
      required: [seq, instanceId, settings, teams]
      properties:
        seq: { type: integer, format: int64 }
        instanceId: { type: string }
        settings: { $ref: "#/components/schemas/Settings" }
        teams:
          type: array
          items: { type: object, additionalProperties: true }
    Team:
      type: object
      required: [id, name, profileInstanceId, leaderId, status, revision]
      properties:
        id: { type: string }
        name: { type: string }
        profileInstanceId: { type: string }
        leaderId: { type: string }
        directory: { type: string }
        status:
          type: string
          enum: [creating, active, archived, deleted, directory_missing, error]
        statusDetail: { type: string }
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Bot:
      type: object
      required: [id, teamId, name, roleId, isLeader, status, revision]
      properties:
        id: { type: string }
        teamId: { type: string }
        name: { type: string }
        roleId: { type: string }
        roleVersion: { type: string }
        isLeader: { type: boolean }
        status:
          type: string
          enum: [idle, queued, working, waiting_approval, waiting_input, interrupted, unknown]
        currentRunId: { type: string }
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    TeamWithBots:
      type: object
      required: [team, bots]
      properties:
        team: { $ref: "#/components/schemas/Team" }
        bots:
          type: array
          items: { $ref: "#/components/schemas/Bot" }
    ApprovalOption:
      type: object
      required: [id]
      properties:
        id: { type: string }
        messageKey: { type: string }
        text: { type: string }
    ApprovalDecision:
      type: object
      required: [optionId, actor, decidedAt]
      properties:
        optionId: { type: string }
        comment: { type: string }
        actor: { type: string }
        decidedAt: { type: string, format: date-time }
    Approval:
      type: object
      required: [id, teamId, requesterBotId, type, summary, options, requestState, revision, createdAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        requesterBotId: { type: string }
        runId: { type: string }
        type: { type: string, enum: [native_tool, collaboration, recruitment, recovery, merge] }
        method: { type: string }
        summary: { type: string }
        reason: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/ApprovalOption" }
        requestState: { type: string, enum: [pending, decided, invalidated] }
        decision: { $ref: "#/components/schemas/ApprovalDecision" }
        responseState: { type: string, enum: [queued, sent, confirmed, unknown, expired] }
        createdAt: { type: string, format: date-time }
        revision: { type: integer, format: int64 }
    Event:
      type: object
      required: [seq, id, instanceId, type, teamId, botId, resourceId, revision, payload, createdAt]
      properties:
        seq: { type: integer, format: int64 }
        id: { type: string }
        instanceId: { type: string }
        type: { type: string }
        teamId: { type: string }
        botId: { type: string }
        resourceId: { type: string }
        revision: { type: integer, format: int64 }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
