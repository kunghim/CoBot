openapi: 3.0.3
info:
  title: CoBot local API
  version: "0.1.0"
  description: >
    Public wire contract of the loopback CoBot core. Success responses are
    {data, requestId}; errors are {error:{code,messageKey,params}, requestId}.
    The /internal/v1 routes serve same-user helper processes (instance
    secret) and the bot MCP bridge (bot token); browser sessions never reach
    them.
servers:
  - url: http://127.0.0.1:0
paths:
  /api/v1/status:
    get:
      operationId: getStatus
      # Anonymous by design: the capability probe and the bootstrap exchange
      # run before a session exists.
      security: []
      summary: Environment, capability and authorization status (anonymous readable)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Status"
  /api/v1/session/bootstrap:
    post:
      operationId: exchangeBootstrap
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Exchange a one-time startup secret for a page session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, secret]
              properties:
                requestId: { type: string, format: uuid }
                secret: { type: string }
      responses:
        "200":
          description: Session established (sets HttpOnly session + CSRF cookies)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BootstrapResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/settings:
    get:
      operationId: getSettings
      security:
        - SessionCookie: []
      summary: Business settings of this profile
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Update business settings with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, patch, expectedRevision]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, format: int64 }
                patch:
                  $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/snapshot:
    get:
      operationId: getSnapshot
      security:
        - SessionCookie: []
      summary: Consistent read of visible entities plus the event cursor
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Snapshot"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/events:
    get:
      operationId: streamEvents
      security:
        - SessionCookie: []
      summary: Durable event stream (fetch SSE) after a cursor
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64 }
        - name: teamId
          in: query
          schema: { type: string }
        - name: botId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of cobot.event frames; each data payload is one Event
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Frames shaped as "id: <seq>", "event: cobot.event",
                  "data: <Event JSON>", then a blank line.
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/engine:
    get:
      operationId: getEngine
      security:
        - SessionCookie: []
      summary: Non-secret Codex engine status for this profile
      responses:
        "200":
          description: Engine status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineStatus"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/roles/{id}/avatar:
    put:
      operationId: setRoleAvatar
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Set a role's avatar (null returns it to the catalog default); members without their own follow it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, avatar]
              properties:
                requestId: { type: string, format: uuid }
                avatar:
                  description: The avatar to use; null follows the default again
                  nullable: true
                  allOf:
                    - $ref: "#/components/schemas/AvatarRef"
      responses:
        "200":
          description: Role avatar set
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [roleId]
                        properties:
                          roleId: { type: string }
                          avatar: { $ref: "#/components/schemas/AvatarRef" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/avatars/uploads:
    post:
      operationId: saveAvatarUpload
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Keep a local picture (already cropped to a 256×256 PNG) for use as an avatar; it stays in the data root
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, data]
              properties:
                requestId: { type: string, format: uuid }
                data: { type: string, format: byte, description: Base64 PNG, at most 512 KB }
      responses:
        "201":
          description: Stored picture
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [file]
                        properties:
                          file: { type: string }
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/avatars/uploads/{file}:
    get:
      operationId: getAvatarUpload
      security:
        - SessionCookie: []
      summary: A stored avatar picture
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The picture
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/avatars/catalog:
    get:
      operationId: getAvatarCatalog
      security:
        - SessionCookie: []
      summary: The avatar catalog cached in this profile, and its last sync
      responses:
        "200":
          description: Cached catalog; empty until a sync succeeds
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AvatarCatalog"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/avatars/catalog/sync:
    post:
      operationId: syncAvatarCatalog
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Check for a newer avatar catalog now; a failed download keeps the cache and is reported in status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Catalog after the check
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AvatarCatalog"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/engine/check:
    post:
      operationId: checkEngine
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Re-run the Codex self-check, including native hook trust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Fresh engine status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineStatus"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: engineLogin
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Start the official Codex login flow (engine auth, not page bootstrap)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "202":
          description: Login flow started; completion arrives via events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/EngineLogin" }
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login/cancel:
    post:
      operationId: engineLoginCancel
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Cancel a pending Codex login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Login cancelled
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: engineLogout
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: End the engine (Codex) session for this profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Engine session ended
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/models:
    get:
      operationId: listModels
      security:
        - SessionCookie: []
      summary: Engine-provided model list (non-secret)
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [models]
                        properties:
                          models:
                            type: array
                            items: { $ref: "#/components/schemas/Model" }
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/providers:
    get:
      operationId: listProviders
      security:
        - SessionCookie: []
      summary: Configured model providers
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [providers]
                        properties:
                          providers:
                            type: array
                            items: { $ref: "#/components/schemas/Provider" }
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createProvider
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Add a model provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Provider" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/providers/{id}:
    get:
      operationId: getProvider
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      security:
        - SessionCookie: []
      summary: One model provider
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Provider" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProvider
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Change a model provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderRequest" }
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Provider" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProvider
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Remove a model provider
      responses:
        "200":
          description: Removed
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/providers/{id}/probe:
    post:
      operationId: reprobeProvider
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Check a stored provider's models again
      description: The key is read from the encrypted credential store, so the user never has to paste it twice. The outcome is recorded on the stored models.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Per-model results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [results]
                        properties:
                          results:
                            type: object
                            additionalProperties: { $ref: "#/components/schemas/ProviderProbeResult" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/providers/{id}/enabled:
    put:
      operationId: setProviderEnabled
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Offer a provider's models to members, or stop offering them
      description: A disabled provider keeps its configuration and is out of every model picker; members that ran on it fall back to the default model from their next turn.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, enabled]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, format: int64, minimum: 1 }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Provider" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/provider-presets:
    get:
      operationId: listProviderPresets
      security:
        - SessionCookie: []
      summary: Built-in vendor catalogue
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [presets]
                        properties:
                          presets:
                            type: array
                            items: { $ref: "#/components/schemas/ProviderPreset" }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/providers/detect:
    post:
      operationId: detectProvider
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Guess the vendor a pasted key belongs to
      description: Matches the key against local patterns only; never calls the network. An unknown key returns an empty id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, apiKey]
              properties:
                requestId: { type: string, format: uuid }
                apiKey: { type: string }
      responses:
        "200":
          description: Detected preset id, empty when unknown
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [presetId]
                        properties:
                          presetId: { type: string }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/providers/discover:
    post:
      operationId: discoverProviderModels
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: List the models an endpoint offers
      description: "Stateless: the endpoint and key the user just typed are used, so the models can be seen before the provider is stored."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, baseUrl]
              properties:
                requestId: { type: string, format: uuid }
                baseUrl: { type: string }
                apiKey: { type: string }
      responses:
        "200":
          description: Model ids
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [models]
                        properties:
                          models:
                            type: array
                            items: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/providers/probe-models:
    post:
      operationId: probeProviderModels
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Check that models can run on an endpoint
      description: One minimal request per model; a model that cannot run is reported with a stable failure code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, baseUrl]
              properties:
                requestId: { type: string, format: uuid }
                baseUrl: { type: string }
                apiKey: { type: string }
                modelIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Per-model results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [results]
                        properties:
                          results:
                            type: object
                            additionalProperties: { $ref: "#/components/schemas/ProviderProbeResult" }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/session/logout:
    post:
      operationId: sessionLogout
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: End the current page session
      responses:
        "200":
          description: Logged out
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/roles:
    get:
      operationId: listRoles
      security:
        - SessionCookie: []
      summary: Built-in role library
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string }
                                nameKey: { type: string }
                                summaryKey: { type: string }
                                name: { type: string }
                                contentVersion: { type: string }
                                scenarios:
                                  type: array
                                  items: { type: string }
                                avatar: { $ref: "#/components/schemas/AvatarRef" }
                          scenarios:
                            type: array
                            items:
                              type: object
                              required: [id, nameKey, name, roleIds, defaultRoleIds]
                              properties:
                                id: { type: string }
                                nameKey: { type: string }
                                name: { type: string }
                                roleIds:
                                  type: array
                                  items: { type: string }
                                defaultRoleIds:
                                  type: array
                                  items: { type: string }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/teams:
    get:
      operationId: listTeams
      security:
        - SessionCookie: []
      summary: Teams with their members
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100, minimum: 1 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: viewBotId
          in: query
          description: Selected member projection; a leader selects the whole team.
          schema: { type: string }
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/TeamWithBots"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTeam
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Create a team bound to one working directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, name, directory]
              properties:
                requestId: { type: string, format: uuid }
