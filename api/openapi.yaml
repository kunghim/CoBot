openapi: 3.0.3
info:
  title: CoBot local API
  version: "0.1.0"
  description: >
    Public wire contract of the loopback CoBot core. Success responses are
    {data, requestId}; errors are {error:{code,messageKey,params}, requestId}.
    Bot-scoped MCP traffic uses separate /internal/v1 routes and is not part
    of this document.
servers:
  - url: http://127.0.0.1:0
paths:
  /api/v1/status:
    get:
      operationId: getStatus
      # Anonymous by design: the capability probe and the bootstrap exchange
      # run before a session exists.
      security: []
      summary: Environment, capability and authorization status (anonymous readable)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Status"
  /api/v1/session/bootstrap:
    post:
      operationId: exchangeBootstrap
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Exchange a one-time startup secret for a page session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, secret]
              properties:
                requestId: { type: string, format: uuid }
                secret: { type: string }
      responses:
        "200":
          description: Session established (sets HttpOnly session + CSRF cookies)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BootstrapResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/settings:
    get:
      operationId: getSettings
      security:
        - SessionCookie: []
      summary: Business settings of this profile
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Update business settings with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, patch]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, format: int64 }
                patch:
                  $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/snapshot:
    get:
      operationId: getSnapshot
      security:
        - SessionCookie: []
      summary: Consistent read of visible entities plus the event cursor
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Snapshot"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/events:
    get:
      operationId: streamEvents
      security:
        - SessionCookie: []
      summary: Durable event stream (fetch SSE) after a cursor
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64 }
        - name: teamId
          in: query
          schema: { type: string }
        - name: botId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of cobot.event frames; each data payload is one Event
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Frames shaped as "id: <seq>", "event: cobot.event",
                  "data: <Event JSON>", then a blank line.
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/engine:
    get:
      operationId: getEngine
      security:
        - SessionCookie: []
      summary: Non-secret Codex engine status for this profile
      responses:
        "200":
          description: Engine status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineStatus"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: engineLogin
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Start the official Codex login flow (engine auth, not page bootstrap)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "202":
          description: Login flow started; completion arrives via events
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login/cancel:
    post:
      operationId: engineLoginCancel
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Cancel a pending Codex login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Login cancelled
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: engineLogout
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: End the engine (Codex) session for this profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Engine session ended
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/models:
    get:
      operationId: listModels
      security:
        - SessionCookie: []
      summary: Engine-provided model list (non-secret)
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          models:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/session/logout:
    post:
      operationId: sessionLogout
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: End the current page session
      responses:
        "200":
          description: Logged out
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/roles:
    get:
      operationId: listRoles
      security:
        - SessionCookie: []
      summary: Built-in role library
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string }
                                nameKey: { type: string }
                                name: { type: string }
                                contentVersion: { type: string }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/teams:
    get:
      operationId: listTeams
      security:
        - SessionCookie: []
      summary: Teams with their members
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/TeamWithBots"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTeam
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Create a team bound to one working directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, name, directory]
              properties:
                requestId: { type: string, format: uuid }
                name: { type: string }
                directory: { type: string }
                initialRoleIds:
                  type: array
                  items: { type: string }
                adoptMarker:
                  type: boolean
                  description: Explicit confirmation to claim a directory that already carries a team marker (copied/moved/foreign instance); without it the request is refused instead of adopting silently.
      responses:
        "201":
          description: Team created (staged, then activated)
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}:
    get:
      operationId: getTeam
      security:
        - SessionCookie: []
      summary: One team with members
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TeamWithBots" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchTeam
      security:
        - SessionCookie: []
      summary: Rename a team
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, name]
              properties:
                requestId: { type: string, format: uuid }
                name: { type: string }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: Renamed team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Team" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTeam
      security:
        - SessionCookie: []
      summary: Soft-delete an archived team with no unfinished work; user files are never touched
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: expectedRevision
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Deleted team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Team" }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/archive:
    post:
      operationId: archiveTeam
      security:
        - SessionCookie: []
      summary: 'Archive a team (dispatch pauses; queued work and tasks are kept)'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: Archived team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Team" }
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/restore:
    post:
      operationId: restoreTeam
      security:
        - SessionCookie: []
      summary: Restore an archived team; queued work resumes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: Restored team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Team" }
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/bots/{id}:
    delete:
      operationId: deleteBot
      security:
        - SessionCookie: []
      summary: Tombstone a member with no unfinished work; history is kept
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: expectedRevision
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Deleted member
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Bot" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/bots:
    post:
      operationId: addBot
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Add one member of an existing role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, roleId]
              properties:
                requestId: { type: string, format: uuid }
                roleId: { type: string }
      responses:
        "201":
          description: Member added
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/directory/rebuild-marker:
    post:
      operationId: rebuildTeamMarker
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Recreate the .cobot identification marker and report losses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Marker rebuilt
  /api/v1/bots/{id}/messages:
    get:
      operationId: listMessages
      security:
        - SessionCookie: []
      summary: Conversation history of one bot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: before
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Messages plus queue state
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: sendMessage
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Send a user message (persisted and queued; answered with 202)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, text]
              properties:
                requestId: { type: string, format: uuid }
                text: { type: string }
      responses:
        "202":
          description: Message persisted and queued
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/messages/{id}/cancel:
    post:
      operationId: cancelMessage
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Cancel a queued (not yet dispatched) user message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Message cancelled
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/runs/{id}/interrupt:
    post:
      operationId: interruptRun
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Request an engine-side stop of one run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "202":
          description: Interrupt requested; final state arrives via events
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/approvals:
    get:
      operationId: listApprovals
      security:
        - SessionCookie: []
      summary: Pending cards (oldest first) or decided history
      parameters:
        - name: teamId
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [pending, history] }
        - name: requesterBotId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Approvals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Approval" }
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/approvals/{id}/decisions:
    post:
      operationId: decideApproval
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Decide once (CAS); response delivery is tracked separately
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, optionId]
              properties:
                requestId: { type: string, format: uuid }
                optionId: { type: string }
                comment: { type: string }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: Decided approval (with responseState)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Approval" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/tasks:
    get:
      operationId: listTasks
      security:
        - SessionCookie: []
      summary: Project a team's task board
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: ownerId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Task" }
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTask
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Create a task with a unique owner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Task" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      security:
        - SessionCookie: []
      summary: One task with its evidence and transfer history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Task" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchTask
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Change status, or change owner through the transfer safety rules
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchTaskRequest" }
      responses:
        "200":
          description: Updated task
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/tasks/{id}/evidence:
    post:
      operationId: submitTaskEvidence
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Record a proof reference for a task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitEvidenceRequest" }
      responses:
        "201":
          description: Evidence recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Evidence" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/tasks/{id}/confirm:
    post:
      operationId: confirmTask
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Confirm a review task as done against evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
                evidenceIds:
                  type: array
                  items: { type: string }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: Confirmed task
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/tasks/{id}/transfers:
    post:
      operationId: offerTaskTransfer
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Offer a two-phase hand-over; the owner is unchanged until accepted
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferTransferRequest" }
      responses:
        "201":
          description: Offered transfer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Transfer" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/transfers/{id}/accept:
    post:
      operationId: acceptTaskTransfer
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Accept and swap the owner atomically
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Transferred task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Task" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/transfers/{id}/cancel:
    post:
      operationId: cancelTaskTransfer
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Withdraw a live offer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Cancelled transfer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Transfer" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/questions:
    get:
      operationId: listQuestions
      security:
        - SessionCookie: []
      summary: Page a team's user questions
      parameters:
        - name: teamId
          in: query
          required: true
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [open, answered, cancelled] }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Question" }
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/questions/{id}/answers:
    post:
      operationId: answerQuestion
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Answer as the user; delivered as a user message, never an authorization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerQuestionRequest" }
      responses:
        "200":
          description: Answered question
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Question" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/questions/{id}/cancel:
    post:
      operationId: cancelQuestion
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Withdraw a still-open question
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: Cancelled question
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Question" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/bots/{id}/collaboration:
    get:
      operationId: listCollaboration
      security:
        - SessionCookie: []
      summary: Read-only record of one member's exchanges with a peer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Collaboration messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Message" }
        "401":
          $ref: "#/components/responses/Error"
  /internal/v1/collaboration:
    post:
      operationId: collaborationTool
      summary: The MCP bridge's only core route; identity comes from the bot token
      security:
        - BotToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollaborationRequest" }
      responses:
        "200":
          description: Tool outcome; the status carries accept/reject/waiting
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ToolResult" }
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: cobot_session
      description: Browser page session minted from a one-time startup link; paired with the cobot_csrf header on writes.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on cookie-authenticated writes; mirrors the cobot_csrf cookie.
    BotToken:
      type: apiKey
      in: header
      name: X-Bot-Token
      description: Bot bridge credential minted by the core; bound to one bot and engine epoch.
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Task:
      type: object
      required: [id, teamId, ownerId, title, status, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        ownerId: { type: string }
        parentId: { type: string }
        title: { type: string }
        description: { type: string }
        acceptanceCriteria: { type: string }
        status: { type: string, enum: [todo, doing, review, done, cancelled] }
        blockedReason: { type: string }
        dependencyIds:
          type: array
          items: { type: string }
        revision: { type: integer, format: int64 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Evidence:
      type: object
      required: [id, taskId, authorId, summary, createdAt]
      properties:
        id: { type: string }
        taskId: { type: string }
        authorId: { type: string }
        summary: { type: string }
        artifactRefs:
          type: array
          items: { type: string }
        candidateRef: { type: string }
        testResult: { type: string }
        reviewResult: { type: string }
        createdAt: { type: string, format: date-time }
    Transfer:
      type: object
      required: [id, taskId, fromBotId, toBotId, taskRevision, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        taskId: { type: string }
        fromBotId: { type: string }
        toBotId: { type: string }
        taskRevision: { type: integer, format: int64 }
        note: { type: string }
        status: { type: string, enum: [offered, accepted, cancelled, stale] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Question:
      type: object
      required: [id, teamId, requesterBotId, question, options, status, revision, createdAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        requesterBotId: { type: string }
        taskId: { type: string }
        runId: { type: string }
        question: { type: string }
        options:
          type: array
          items: { type: string }
        status: { type: string, enum: [open, answered, cancelled] }
        answerText: { type: string }
        answerMessageId: { type: string }
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time }
    Message:
      type: object
      required: [id, teamId, botId, kind, blocks, createdAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        botId: { type: string }
        kind: { type: string, enum: [user, assistant, collaboration, system] }
        blocks:
          type: array
          items: { type: object, additionalProperties: true }
        requestId: { type: string }
        deliveryStatus: { type: string }
        runId: { type: string }
        sourceBotId: { type: string }
        createdAt: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      required: [requestId, title, ownerId]
      properties:
        requestId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        acceptanceCriteria: { type: string }
        ownerId: { type: string }
        parentId: { type: string }
        dependencyIds:
          type: array
          items: { type: string }
    PatchTaskRequest:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [todo, doing, review, done, cancelled] }
        blockedReason: { type: string }
        ownerId: { type: string }
        expectedRevision: { type: integer, format: int64 }
    SubmitEvidenceRequest:
      type: object
      required: [requestId, summary]
      properties:
        requestId: { type: string, format: uuid }
        summary: { type: string }
        artifactRefs:
          type: array
          items: { type: string }
        candidateRef: { type: string }
        testResult: { type: string }
        reviewResult: { type: string }
    OfferTransferRequest:
      type: object
      required: [requestId, toBotId]
      properties:
        requestId: { type: string, format: uuid }
        toBotId: { type: string }
        note: { type: string }
    AnswerQuestionRequest:
      type: object
      required: [requestId, answerText]
      properties:
        requestId: { type: string, format: uuid }
        answerText: { type: string }
        expectedRevision: { type: integer, format: int64 }
    CollaborationRequest:
      type: object
      required: [requestId, tool]
      properties:
        requestId: { type: string, format: uuid }
        tool:
          type: string
          enum: [get_context, list_tasks, get_task, list_roles, send_message, create_task, propose_task, assign_task, update_task, submit_evidence, report_completion, confirm_task, offer_transfer, accept_transfer, ask_user, request_member, request_merge]
        arguments: { type: object, additionalProperties: true }
    ToolResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, accepted, duplicate, waiting, rejected, unavailable] }
        data: { type: object, additionalProperties: true }
        error:
          type: object
          required: [code, messageKey]
          properties:
            code: { type: string }
            messageKey: { type: string }
            params: { type: object, additionalProperties: true }
    Envelope:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, messageKey]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - idempotency_conflict
                - revision_conflict
                - capability_missing
                - engine_unavailable
                - internal
            messageKey: { type: string }
            params:
              type: object
              additionalProperties: true
        requestId: { type: string }
    EngineStatus:
      type: object
      required: [status, loggedIn]
      properties:
        status:
          type: string
          enum: [not_configured, ready, error, starting]
        binaryPath: { type: string }
        version: { type: string }
        protocol: { type: string }
        loggedIn: { type: boolean }
        capabilities:
          type: array
          items: { type: string }
        errorKey: { type: string }
    Status:
      type: object
      required:
        [product, version, profile, environment, dataRoot, endpoint, instanceId, serviceEpoch, startedAt, authorized, engine]
      properties:
        product: { type: string }
        version: { type: string }
        profile: { type: string, enum: [development, production] }
        environment: { type: string, enum: [development, production] }
        dataRoot: { type: string }
        endpoint: { type: string }
        instanceId: { type: string }
        serviceEpoch: { type: string }
        startedAt: { type: string, format: date-time }
        authorized: { type: boolean }
        engine: { $ref: "#/components/schemas/EngineStatus" }
    BootstrapResult:
      type: object
      required: [sessionExpiresAt, userId]
      properties:
        sessionExpiresAt: { type: string, format: date-time }
        userId: { type: string }
        bearerToken:
          type: string
          description: Desktop-shell bearer (30 min, renewable); browser flow ignores it
        bearerExpiresAt: { type: string, format: date-time }
    Settings:
      type: object
      required:
        [revision, language, defaultModel, evalModel, memberLimit, chainLimit, budgetScope, budgetTokens, enginePath]
      properties:
        revision: { type: integer, format: int64 }
        language: { type: string, enum: [zh-CN, en] }
        defaultModel: { type: string }
        evalModel: { type: string }
        memberLimit: { type: integer }
        chainLimit: { type: integer }
        budgetScope: { type: string, enum: ["", bot, team] }
        budgetTokens: { type: integer, format: int64 }
        enginePath: { type: string }
    SettingsPatch:
      type: object
      properties:
        language: { type: string, enum: [zh-CN, en] }
        defaultModel: { type: string }
        evalModel: { type: string }
        memberLimit: { type: integer }
        chainLimit: { type: integer }
        budgetScope: { type: string, enum: ["", bot, team] }
        budgetTokens: { type: integer, format: int64 }
        enginePath: { type: string }
    Snapshot:
      type: object
      required: [seq, instanceId, settings, teams]
      properties:
        seq: { type: integer, format: int64 }
        instanceId: { type: string }
        settings: { $ref: "#/components/schemas/Settings" }
        teams:
          type: array
          items: { type: object, additionalProperties: true }
    Team:
      type: object
      required: [id, name, profileInstanceId, leaderId, status, revision]
      properties:
        id: { type: string }
        name: { type: string }
        profileInstanceId: { type: string }
        leaderId: { type: string }
        directory: { type: string }
        status:
          type: string
          enum: [creating, active, archived, deleted, directory_missing, error]
        statusDetail: { type: string }
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Bot:
      type: object
      required: [id, teamId, name, roleId, isLeader, status, revision]
      properties:
        id: { type: string }
        teamId: { type: string }
        name: { type: string }
        roleId: { type: string }
        roleVersion: { type: string }
        isLeader: { type: boolean }
        status:
          type: string
          enum: [idle, queued, working, waiting_approval, waiting_input, interrupted, unknown]
        currentRunId: { type: string }
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    TeamWithBots:
      type: object
      required: [team, bots]
      properties:
        team: { $ref: "#/components/schemas/Team" }
        bots:
          type: array
          items: { $ref: "#/components/schemas/Bot" }
    ApprovalOption:
      type: object
      required: [id]
      properties:
        id: { type: string }
        messageKey: { type: string }
        text: { type: string }
    ApprovalDecision:
      type: object
      required: [optionId, actor, decidedAt]
      properties:
        optionId: { type: string }
        comment: { type: string }
        actor: { type: string }
        decidedAt: { type: string, format: date-time }
    Approval:
      type: object
      required: [id, teamId, requesterBotId, type, summary, options, requestState, revision, createdAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        requesterBotId: { type: string }
        runId: { type: string }
        type: { type: string, enum: [native_tool, collaboration, recruitment, recovery, merge] }
        method: { type: string }
        summary: { type: string }
        reason: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/ApprovalOption" }
        requestState: { type: string, enum: [pending, decided, invalidated] }
        decision: { $ref: "#/components/schemas/ApprovalDecision" }
        responseState: { type: string, enum: [queued, sent, confirmed, unknown, expired] }
        createdAt: { type: string, format: date-time }
        revision: { type: integer, format: int64 }
    Event:
      type: object
      required: [seq, id, instanceId, type, teamId, botId, resourceId, revision, payload, createdAt]
      properties:
        seq: { type: integer, format: int64 }
        id: { type: string }
        instanceId: { type: string }
        type: { type: string }
        teamId: { type: string }
        botId: { type: string }
        resourceId: { type: string }
        revision: { type: integer, format: int64 }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
