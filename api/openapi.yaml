openapi: 3.0.3
info:
  title: CoBot local API
  version: "0.1.0"
  description: >
    Public wire contract of the loopback CoBot core. Success responses are
    {data, requestId}; errors are {error:{code,messageKey,params}, requestId}.
    The /internal/v1 routes serve same-user helper processes (instance
    secret) and the bot MCP bridge (bot token); browser sessions never reach
    them.
servers:
  - url: http://127.0.0.1:0
paths:
  /api/v1/status:
    get:
      operationId: getStatus
      # Anonymous by design: the capability probe and the bootstrap exchange
      # run before a session exists.
      security: []
      summary: Environment, capability and authorization status (anonymous readable)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Status"
  /api/v1/session/bootstrap:
    post:
      operationId: exchangeBootstrap
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Exchange a one-time startup secret for a page session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, secret]
              properties:
                requestId: { type: string, format: uuid }
                secret: { type: string }
      responses:
        "200":
          description: Session established (sets HttpOnly session + CSRF cookies)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BootstrapResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/settings:
    get:
      operationId: getSettings
      security:
        - SessionCookie: []
      summary: Business settings of this profile
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Update business settings with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, patch, expectedRevision]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, format: int64 }
                patch:
                  $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/snapshot:
    get:
      operationId: getSnapshot
      security:
        - SessionCookie: []
      summary: Consistent read of visible entities plus the event cursor
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Snapshot"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/events:
    get:
      operationId: streamEvents
      security:
        - SessionCookie: []
      summary: Durable event stream (fetch SSE) after a cursor
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64 }
        - name: teamId
          in: query
          schema: { type: string }
        - name: botId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of cobot.event frames; each data payload is one Event
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Frames shaped as "id: <seq>", "event: cobot.event",
                  "data: <Event JSON>", then a blank line.
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/engine:
    get:
      operationId: getEngine
      security:
        - SessionCookie: []
      summary: Non-secret Codex engine status for this profile
      responses:
        "200":
          description: Engine status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineStatus"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/engine/check:
    post:
      operationId: checkEngine
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Re-run the Codex self-check, including native hook trust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Fresh engine status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineStatus"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: engineLogin
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Start the official Codex login flow (engine auth, not page bootstrap)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "202":
          description: Login flow started; completion arrives via events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/EngineLogin" }
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login/cancel:
    post:
      operationId: engineLoginCancel
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Cancel a pending Codex login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Login cancelled
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: engineLogout
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: End the engine (Codex) session for this profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Engine session ended
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/models:
    get:
      operationId: listModels
      security:
        - SessionCookie: []
      summary: Engine-provided model list (non-secret)
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [models]
                        properties:
                          models:
                            type: array
                            items: { $ref: "#/components/schemas/Model" }
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/session/logout:
    post:
      operationId: sessionLogout
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: End the current page session
      responses:
        "200":
          description: Logged out
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/roles:
    get:
      operationId: listRoles
      security:
        - SessionCookie: []
      summary: Built-in role library
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string }
                                nameKey: { type: string }
                                summaryKey: { type: string }
                                name: { type: string }
                                contentVersion: { type: string }
                                scenarios:
                                  type: array
                                  items: { type: string }
                          scenarios:
                            type: array
                            items:
                              type: object
                              required: [id, nameKey, name, roleIds, defaultRoleIds]
                              properties:
                                id: { type: string }
                                nameKey: { type: string }
                                name: { type: string }
                                roleIds:
                                  type: array
                                  items: { type: string }
                                defaultRoleIds:
                                  type: array
                                  items: { type: string }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/teams:
    get:
      operationId: listTeams
      security:
        - SessionCookie: []
      summary: Teams with their members
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100, minimum: 1 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: viewBotId
          in: query
          description: Selected member projection; a leader selects the whole team.
          schema: { type: string }
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/TeamWithBots"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTeam
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Create a team bound to one working directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, name, directory]
              properties:
                requestId: { type: string, format: uuid }
                name: { type: string }
                directory: { type: string }
                initialRoleIds:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Team created (staged, then activated)
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}:
    get:
      operationId: getTeam
      security:
        - SessionCookie: []
      summary: One team with members
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TeamWithBots" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchTeam
      security:
        - SessionCookie: []
      summary: Change exactly one of a team's name, permission mode or reasoning effort
      description: >-
        The body carries exactly one of name, permissionMode or
        reasoningEffort (otherwise 400 error.team.patch_one_field).
        Permission mode and reasoning effort apply from each member's next
        turn.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, expectedRevision]
              properties:
                requestId: { type: string, format: uuid }
                name: { type: string }
                permissionMode:
                  type: string
                  enum: [read_only, default, full]
                  description: Applies from each member's next turn.
                reasoningEffort:
                  type: string
                  description: How hard members think from their next turn (an effort the model lists); empty follows the model's default.
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Team" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTeam
      security:
        - SessionCookie: []
      summary: Soft-delete an archived team with no unfinished work; user files are never touched
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: If-Match
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Deleted team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Team" }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/archive:
    post:
      operationId: archiveTeam
      security:
        - SessionCookie: []
      summary: 'Archive a team (dispatch pauses; queued work and tasks are kept)'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, expectedRevision]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: Archived team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Team" }
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/restore:
    post:
      operationId: restoreTeam
      security:
        - SessionCookie: []
      summary: Restore an archived team; queued work resumes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, expectedRevision]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: Restored team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Team" }
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/bots/{id}:
    delete:
      operationId: deleteBot
      security:
        - SessionCookie: []
      summary: Tombstone a member with no unfinished work; history is kept
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: If-Match
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Deleted member
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Bot" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/bots:
    post:
      operationId: addBot
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Add one member of an existing role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, roleId]
              properties:
                requestId: { type: string, format: uuid }
                roleId: { type: string }
      responses:
        "201":
          description: Member added
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/warm:
    post:
      operationId: warmTeam
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Start the team's engine in the background ahead of the first message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "202":
          description: Warm-up started (or not needed)
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/open-path:
    post:
      operationId: openTeamPath
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Open (or reveal) a file inside the team folder with the system's default program
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, path]
              properties:
                requestId: { type: string, format: uuid }
                path: { type: string, description: "Link target as written by a member; absolute, relative to the team folder, or with a line suffix." }
                reveal: { type: boolean, description: "Show the file in the file manager instead of opening it." }
      responses:
        "200":
          description: Opened
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/bots/{id}/messages:
    get:
      operationId: listMessages
      security:
        - SessionCookie: []
      summary: Conversation history of one bot
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: viewBotId
          in: query
          description: Selected member projection; a leader selects the whole team.
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: before
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Messages plus queue state and the runs (with steps) between them
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ConversationPage" }
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: sendMessage
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Send a user message (persisted and queued; answered with 202)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, text]
              properties:
                requestId: { type: string, format: uuid }
                text: { type: string }
      responses:
        "202":
          description: Message persisted and queued
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/messages/{id}/cancel:
    post:
      operationId: cancelMessage
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Cancel a queued (not yet dispatched) user message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Message cancelled
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/runs/{id}/interrupt:
    post:
      operationId: interruptRun
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Request an engine-side stop of one run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "202":
          description: Interrupt requested; final state arrives via events
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/approvals:
    get:
      operationId: listApprovals
      security:
        - SessionCookie: []
      summary: Pending cards (oldest first) or decided history
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: viewBotId
          in: query
          description: Selected member projection; a leader selects the whole team.
          schema: { type: string }
        - name: teamId
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [pending, history] }
        - name: requesterBotId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Approvals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Approval" }
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/approvals/{id}/decisions:
    post:
      operationId: decideApproval
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
