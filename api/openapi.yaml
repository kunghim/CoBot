      operationId: patchTeam
      security:
        - SessionCookie: []
      summary: Change exactly one of a team's name, permission mode, reasoning effort or model provider
      description: >-
        The body carries exactly one of name, permissionMode, reasoningEffort or
        providerId (otherwise 400 error.team.patch_one_field).
        Permission mode and reasoning effort apply from each member's next
        turn.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, expectedRevision]
              properties:
                requestId: { type: string, format: uuid }
                name: { type: string }
                permissionMode:
                  type: string
                  enum: [read_only, default, full]
                  description: Applies from each member's next turn.
                reasoningEffort:
                  type: string
                  description: How hard members think from their next turn (an effort the model lists); empty follows the model's default.
                providerId:
                  type: string
                  description: The model provider this team runs with; empty follows the profile's default. Applies from the team's next turn.
                expectedRevision: { type: integer, format: int64 }
