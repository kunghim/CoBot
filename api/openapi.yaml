      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Task" }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      security:
        - SessionCookie: []
      summary: One card with its handoff records
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TaskDetail" }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/requirements:
    get:
      operationId: listRequirements
      security:
        - SessionCookie: []
      summary: A team's requirements with their documents and routes, newest first
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Requirements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Requirement" }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/requirements/{id}/cancel:
    post:
      operationId: cancelRequirement
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Cancel a requirement; its open cards and confirmations end
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Cancelled requirement
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Requirement" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/questions:
    get:
      operationId: listQuestions
      security:
        - SessionCookie: []
      summary: Page a team's user questions
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: viewBotId
          in: query
          description: Selected member projection; a leader selects the whole team.
          schema: { type: string }
        - name: teamId
          in: query
          required: true
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [open, answered, cancelled] }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Question" }
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/questions/{id}/answers:
    post:
      operationId: answerQuestion
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Answer as the user; delivered as a user message, never an authorization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerQuestionRequest" }
      responses:
        "200":
          description: Answered question
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Question" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/questions/{id}/cancel:
    post:
      operationId: cancelQuestion
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Withdraw a still-open question
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, expectedRevision]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: Cancelled question
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Question" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/bots/{id}/stats:
    get:
      operationId: getBotStats
      security:
        - SessionCookie: []
      summary: One member's session statistics, read off what the engine reported (no model call)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SessionStats" }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/bots/{id}/collaboration:
    get:
      operationId: listCollaboration
      security:
        - SessionCookie: []
      summary: Read-only record of one member's exchanges with a peer
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: teamId
          in: query
          description: The team both members belong to; required with peerBotId.
          schema: { type: string }
        - name: peerBotId
          in: query
          description: Limit the record to messages between the member and this peer.
          schema: { type: string }
        - name: viewBotId
          in: query
          description: Selected member projection; a leader selects the whole team.
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Collaboration messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Message" }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/teams/{id}/activity:
    get:
      operationId: listActivity
      security:
        - SessionCookie: []
      summary: Newest-first team activity feed (events)
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: viewBotId
          in: query
          description: Selected member projection; a leader selects the whole team.
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Activity events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Event" }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/bots/{id}/memories:
    get:
      operationId: listMemories
      security:
        - SessionCookie: []
      summary: Live memories of one member (user reads any member; a bot only itself)
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: viewBotId
          in: query
          description: Selected member projection; a leader selects the whole team.
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Memories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Memory" }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/bots/{id}/memories/{memoryId}:
    delete:
      operationId: deleteMemory
      security:
        - SessionCookie: []
      summary: Tombstone one memory; the same fact is never recreated automatically
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: memoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/directories:
    get:
      operationId: listDirectories
      security:
        - SessionCookie: []
      summary: Immediate subdirectories of one path for the Web picker (names only)
      parameters:
        - name: path
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Child directories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          path: { type: string }
                          children:
                            type: array
                            items: { type: string }
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/directories/pick:
    post:
      operationId: pickDirectory
      # Cookie-authenticated writes must echo the CSRF token; the scheme
      # documents the header rather than changing the handler.
      security:
        - SessionCookie: []
          CSRFToken: []
      summary: Show the native folder chooser on this machine and return the chosen path
      description: >-
        Blocks until the user chooses or cancels. The path is only a
        suggestion; team creation validates it as usual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Chosen path, or cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [path, cancelled]
                        properties:
                          path: { type: string }
                          cancelled: { type: boolean }
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/directories/check:
    post:
      operationId: checkDirectory
      security:
        - SessionCookie: []
      summary: Validate a directory for team creation without touching anything
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, path]
              properties:
                requestId: { type: string, format: uuid }
                path: { type: string }
      responses:
        "200":
          description: Verdict
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          canonical: { type: string }
                          ok: { type: boolean }
                          duplicate: { type: boolean }
                          nested: { type: boolean }
                          claimed:
                            type: boolean
                            description: Another team (possibly in another CoBot instance) still claims the folder through its marker; creation refuses it.
                          teamId: { type: string }
                          teamName: { type: string }
                          archived:
                            type: boolean
                            description: The folder belongs to an archived team; restoring that team is the way to use it again.
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/authorizations:
    get:
      operationId: listAuthorizations
      security:
        - SessionCookie: []
      summary: Live bridge credentials without their token values
      responses:
        "200":
          description: Authorizations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                botId: { type: string }
                                teamId: { type: string }
                                engineEpoch: { type: string }
                                expiresAt: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/authorizations/{id}/revoke:

    post:
      operationId: revokeAuthorization
      security:
        - SessionCookie: []
      summary: Revoke every live credential of one member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revoked: { type: boolean }
        "404":
          $ref: "#/components/responses/Error"
  /internal/v1/session/link:
    post:
      operationId: internalSessionLink
      security:
        - InstanceSecret: []
      summary: Mint a one-time bootstrap secret (internal, instance secret only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "200":
          description: One-time bootstrap secret
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bootstrapSecret: { type: string }
                          endpoint: { type: string }
                          expiresAt: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /internal/v1/service/stop:
    post:
      operationId: internalServiceStop
      security:
        - InstanceSecret: []
      summary: Ask the core to shut down (internal, instance secret only)
      description: >-
        Answers 202 before shutdown begins; 409 when this core has no
        shutdown hook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "202":
          description: Shutdown requested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [stopping]
                        properties:
                          stopping: { type: boolean }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /internal/v1/collaboration:
    post:
      operationId: collaborationTool
      summary: The MCP bridge's only core route; identity comes from the bot token
      security:
        - BotToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollaborationRequest" }
      responses:
        "200":
          description: Tool outcome; the status carries accept/reject/waiting
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ToolResult" }
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    InstanceSecret:
      type: apiKey
      in: header
      name: X-Instance-Secret
      description: Local instance secret for internal endpoints; only a process holding this profile's runtime credential may mint bootstrap links.
    SessionCookie:
      type: apiKey
      in: cookie
      name: cobot_session
      description: Browser page session minted from a one-time startup link; paired with the cobot_csrf header on writes.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on cookie-authenticated writes; mirrors the cobot_csrf cookie.
    BotToken:
      type: apiKey
      in: header
      name: X-Bot-Token
      description: Bot bridge credential minted by the core; bound to one bot and engine epoch.
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Provider:
      type: object
      description: A model vendor or gateway the engine can call. The secret is never part of it.
      required: [id, name, kind, authMode, endpoints, models, enabled, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [official, custom] }
        authMode: { type: string, enum: [chatgpt, api_key] }
        credentialRef: { type: string }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/ProviderEndpoint" }
        models:
          type: array
          description: The models the user kept, not the vendor's full catalogue.
          items: { $ref: "#/components/schemas/ProviderModel" }
        defaultModel: { type: string }
        retries: { $ref: "#/components/schemas/ProviderRetries" }
        presetId: { type: string }
        enabled: { type: boolean, description: Whether members may pick this provider's models. }
        revision: { type: integer, format: int64 }
        hasCredential: { type: boolean, description: Whether a key is stored for this provider. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProviderEndpoint:
      type: object
      description: One wire dialect the provider offers.
      required: [dialect, baseUrl]
      properties:
        dialect: { type: string, enum: [openai-responses, anthropic-messages] }
        baseUrl: { type: string }
    ProviderModel:
      type: object
      required: [id]
      properties:
        id: { type: string }
        displayName: { type: string }
        contextWindow: { type: integer }
        defaultEffort: { type: string }
        supportedEfforts:
          type: array
          items: { type: string }
        inputModalities:
          type: array
          items: { type: string }
        status: { type: string, enum: [ok, failed, unknown] }
        failure: { type: string, description: Stable machine code of the last check. }
        message: { type: string, description: Human-readable detail of the last check. }
    ProviderRetries:
      type: object
      description: How often the engine may retry a request to this provider.
      properties:
        request: { type: integer }
        stream: { type: integer }
    ProviderRequest:
      type: object
      required: [requestId, id, name, kind, authMode, endpoints]
      properties:
        requestId: { type: string, format: uuid }
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [official, custom] }
        authMode: { type: string, enum: [chatgpt, api_key] }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/ProviderEndpoint" }
        models:
          type: array
          items: { $ref: "#/components/schemas/ProviderModel" }
        defaultModel: { type: string }
        retries: { $ref: "#/components/schemas/ProviderRetries" }
        presetId: { type: string }
        apiKey:
          type: string
          description: Written straight to the encrypted credential store; never stored in the provider record and never returned.
        expectedRevision: { type: integer, format: int64 }
    ProviderPreset:
      type: object
      description: One built-in vendor.
      required: [id, name, short, color, official, authMode, endpoints]
      properties:
        id: { type: string }
        name: { type: string }
        short: { type: string }
        color: { type: string }
        keyUrl: { type: string }
        official: { type: boolean }
        authMode: { type: string, enum: [chatgpt, api_key] }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/ProviderEndpoint" }
        models:
          type: array
          description: Fallback catalogue, used when discovery fails.
          items: { $ref: "#/components/schemas/ProviderModel" }
        keyPatterns:
          type: array
          items: { type: string }
    ProviderProbeResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        code: { type: string, description: Stable machine code, e.g. quota or auth_invalid. }
        message: { type: string }
    BrowserViewport:
      type: object
      required: [width, height]
      description: A tab's real window size as the page renders it; absent on a tab nobody set one for (the browser's default window).
      properties:
        width: { type: integer }
        height: { type: integer }
        mobile: { type: boolean }
    Task:
      type: object
      description: A card, one stage of a requirement's route held by one member.
      required: [id, teamId, ownerId, title, status, stageIndex, returnTo, revision, createdAt, updatedAt, createdBy]
      properties:
        id: { type: string }
        teamId: { type: string }
        ownerId: { type: string }
        title: { type: string }
        description: { type: string }
        acceptanceCriteria: { type: string }
        status: { type: string, enum: [todo, doing, done, cancelled] }
        reviewType:
          type: string
          enum: [requirements, design, test_plan, code, general]
          description: The checklist of a review stage's card.
        requirementId: { type: string }
        stageIndex: { type: integer, description: The card's stage on the route; -1 for a requirement-document card. }
        stageKind:
          type: string
          enum: [confirm, design, review, test_cases, implement, test, accept, draft, escalation]
        returnTo: { type: integer, description: The stage a return-to-me rework card goes back to; -1 runs the route on. }
        revision: { type: integer, format: int64 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Evidence:
      type: object
      description: A handoff record.
      required: [id, taskId, authorId, summary, createdAt, artifactRefs]
      properties:
        id: { type: string }
        taskId: { type: string }
        authorId: { type: string }
        summary: { type: string }
        artifactRefs:
          type: array
          items: { type: string }
        outcome: { type: string, enum: [done, back, escalate, resume] }
        mode: { type: string, enum: [rerun, return_to_me] }
        suggestions: { type: string }
        execution: { $ref: "#/components/schemas/Execution" }
        createdAt: { type: string, format: date-time }
    Execution:
      type: object
      description: What the engine reported a member ran and changed while it held the card.
      required: [commands, files]
      properties:
        commands:
          type: array
          items:
            type: object
            required: [command]
            properties:
              command: { type: string }
              exitCode: { type: integer }
        files:
          type: array
          items: { type: string }
    Stage:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [confirm, design, review, test_cases, implement, test, accept] }
        ownerId: { type: string }
        reviewType: { type: string, enum: [requirements, design, test_plan, code, general] }
        criteria: { type: string }
    Requirement:
      type: object
      required: [id, teamId, title, document, stages, status, createdBy, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        title: { type: string }
        document: { type: string, description: The project manager's requirement document (Markdown). }
        stages:
          type: array
          items: { $ref: "#/components/schemas/Stage" }
        status: { type: string, enum: [active, accepting, done, cancelled] }
        createdBy: { type: string }
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Question:
      type: object
      required: [id, kind, teamId, requesterBotId, question, options, status, revision, createdAt]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: ['', confirm, acceptance]
          description: confirm is a confirm stage of a route; acceptance hands a finished requirement to the user; '' is an ask_user question.
        requirementId: { type: string }
        stageIndex: { type: integer }
        teamId: { type: string }
        requesterBotId: { type: string }
        taskId: { type: string }
        runId: { type: string }
        question: { type: string }
        options:
          type: array
          items: { type: string }
        status: { type: string, enum: [open, answered, cancelled] }
        answerText: { type: string }
        answerMessageId: { type: string }
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time }
    Message:
      type: object
      required: [id, teamId, botId, kind, blocks, createdAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        botId: { type: string }
        kind: { type: string, enum: [user, assistant, collaboration, system] }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/TextBlock" }
        requestId: { type: string }
        deliveryStatus: { type: string, enum: [waiting_dependency, queued, dispatching, accepted, cancelled, unknown] }
        runId: { type: string }
        sourceBotId: { type: string }
        createdAt: { type: string, format: date-time }
    SessionStats:
      type: object
      required: [turns, steps, modelMs, toolMs, tokens, context]
      properties:
        turns: { type: integer }
        steps: { type: integer }
        modelMs: { type: integer, format: int64, description: "Turn time less tools and approval waits." }
        toolMs: { type: integer, format: int64 }
        firstStepMs: { type: integer, format: int64, description: "Estimated time to first token: turn start to its first step, averaged." }
        outputTokensPerSecond: { type: number, description: "Estimated output speed over the model time." }
        tokens:
          type: object
          required: [input, cachedRead, cacheWrite, output, reasoning]
          properties:
            input: { type: integer, format: int64 }
            cachedRead: { type: integer, format: int64 }
            cacheWrite: { type: integer, format: int64 }
            output: { type: integer, format: int64 }
            reasoning: { type: integer, format: int64 }
        context:
          type: object
          required: [used]
          properties:
            used: { type: integer, format: int64, description: "Tokens of the last model call: the context in use." }
            window: { type: integer, format: int64 }
        rateLimits: { type: object, additionalProperties: true, description: "The account's latest rate limits, as Codex reports them." }
    Memory:
      type: object
      required: [id, teamId, botId, body, createdAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        botId: { type: string }
        body: { type: string }
        sourceRunId: { type: string }
        sourceTaskId: { type: string }
        createdAt: { type: string, format: date-time }
    AnswerQuestionRequest:
      type: object
      required: [requestId, answerText, expectedRevision]
      properties:
        requestId: { type: string, format: uuid }
        answerText: { type: string, description: The answer; for a confirmation or acceptance, the requested changes (required with revise). }
        decision:
          type: string
          enum: [accept, revise]
          description: Required for a confirmation or acceptance question, refused for any other.
        mode:
          type: string
          enum: [rerun, return_to_me]
          description: For revise on a confirmation, where the fixed work goes. rerun (default) runs the stages in between again; return_to_me comes straight back to this confirmation.
        expectedRevision: { type: integer, format: int64 }
    CollaborationRequest:
      type: object
      required: [requestId, tool]
      properties:
        requestId: { type: string, format: uuid }
        tool:
          type: string
          enum: [view_tasks, start_requirement, handoff, send_message, ask_user, browser]
        arguments: { type: object, additionalProperties: true }
        callId: { type: string, description: "Bridge-only: the engine's id for this tool call; a write without an idempotencyKey derives its key from it." }
        providerThreadId: { type: string, description: "Bridge-only native transport identity, never a model argument." }
        providerTurnId: { type: string, description: "Bridge-only native transport identity, never a model argument." }
    ToolResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, accepted, duplicate, waiting, rejected, unavailable] }
        data: { type: object, additionalProperties: true }
        error:
          type: object
          required: [code, messageKey]
          properties:
            status: { type: string }
            code: { type: string }
            messageKey: { type: string }
            params: { type: object, additionalProperties: true }
    Envelope:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, messageKey]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - idempotency_conflict
                - revision_conflict
                - capability_missing
                - engine_unavailable
                - internal
            messageKey: { type: string }
            params:
              type: object
              additionalProperties: true
        requestId: { type: string }
    EngineLogin:
      type: object
      required: [type, loginId, authUrl]
      properties:
        type: { type: string, enum: [chatgpt] }
        loginId: { type: string }
        authUrl: { type: string, format: uri }
    EngineStatus:
      type: object
      required: [status, loggedIn]
      properties:
        status:
          type: string
          enum: [not_configured, ready, error, starting]
        binaryPath: { type: string }
        version: { type: string }
        protocol: { type: string }
        loggedIn: { type: boolean }
        capabilities:
          type: array
          items: { type: string }
        errorKey: { type: string }
    Status:
      type: object
      required:
        [product, version, profile, environment, dataRoot, endpoint, instanceId, serviceEpoch, startedAt, authorized, engine, sessionCookieName, csrfCookieName]
      properties:
        sessionCookieName: { type: string }
        csrfCookieName: { type: string }
        product: { type: string }
        version: { type: string }
        profile: { type: string, enum: [development, production] }
        environment: { type: string, enum: [development, production] }
        dataRoot: { type: string }
        endpoint: { type: string }
        instanceId: { type: string }
        serviceEpoch: { type: string }
        startedAt: { type: string, format: date-time }
        authorized: { type: boolean }
        engine: { $ref: "#/components/schemas/EngineStatus" }
    BootstrapResult:
      type: object
      required: [sessionExpiresAt, userId, sessionCookieName, csrfCookieName]
      properties:
        sessionCookieName: { type: string }
        csrfCookieName: { type: string }
        sessionExpiresAt: { type: string, format: date-time }
        userId: { type: string }
        bearerToken:
          type: string
          description: Desktop-shell bearer (30 min, renewable); browser flow ignores it
        bearerExpiresAt: { type: string, format: date-time }
    AvatarCatalog:
      type: object
      required: [series, status]
      properties:
        series:
          type: array
          items:
            $ref: "#/components/schemas/AvatarSeries"
        status:
          type: object
          required: [syncing]
          properties:
            syncing: { type: boolean }
            lastSyncAt: { type: string, format: date-time }
            lastError: { type: string }
    AvatarRef:
      type: object
      description: >-
        An avatar the user chose: catalog parts (kind catalog: series, shape,
        eyes, color) or a local picture (kind upload: file). Never an image.
      required: [kind]
      properties:
        kind: { type: string, enum: [catalog, upload] }
        series: { type: string }
        shape: { type: string }
        eyes: { type: string }
        color: { type: string, pattern: "^#[0-9a-f]{6}$" }
        file: { type: string, pattern: "^[0-9a-f]{64}\\.png$" }
    AvatarSeries:
      type: object
      required: [id, name, kind, version, data]
      properties:
        id: { type: string }
        name:
          type: object
          additionalProperties: { type: string }
        kind: { type: string }
        version: { type: integer }
        data:
          type: object
          description: The series file as published (format in assets/avatars)
          additionalProperties: true
    Settings:
      type: object
      required:
        [revision, language, colorMode, theme, defaultModel, memberLimit, chainLimit, reviewRejectLimit, budgetScope, budgetTokens, enginePath]
      properties:
        revision: { type: integer, format: int64 }
        language: { type: string, enum: [zh-CN, en] }
        colorMode: { type: string, enum: [system, light, dark] }
        theme: { type: string, enum: [graphite, harbor, dusk, classic] }
        defaultModel: { type: string }
        defaultProvider: { type: string, description: The model provider the profile runs with; empty means the engine's own. }
        memberLimit: { type: integer }
        chainLimit: { type: integer }
        reviewRejectLimit: { type: integer, minimum: 1, maximum: 20 }
        budgetScope: { type: string, enum: ["", bot, team] }
        budgetTokens: { type: integer, format: int64 }
        enginePath: { type: string }
    SettingsPatch:
      type: object
      properties:
        language: { type: string, enum: [zh-CN, en] }
        colorMode: { type: string, enum: [system, light, dark] }
        theme: { type: string, enum: [graphite, harbor, dusk, classic] }
        defaultModel: { type: string }
        defaultProvider: { type: string, description: The model provider to run with; must name a configured provider. }
        memberLimit: { type: integer }
        chainLimit: { type: integer }
        reviewRejectLimit: { type: integer, minimum: 1, maximum: 20 }
        budgetScope: { type: string, enum: ["", bot, team] }
        budgetTokens: { type: integer, format: int64 }
        enginePath: { type: string }
    Snapshot:
      type: object
      required: [seq, instanceId, settings, teams, engine]
      properties:
        seq: { type: integer, format: int64 }
        instanceId: { type: string }
        settings: { $ref: "#/components/schemas/Settings" }
        teams:
          type: array
          items: { $ref: "#/components/schemas/TeamWithBots" }
        engine: { $ref: "#/components/schemas/EngineStatus" }
    Team:
      type: object
      required: [id, name, profileInstanceId, leaderId, directory, status, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        profileInstanceId: { type: string }
        leaderId: { type: string }
        directory: { type: string }
        status:
          type: string
          enum: [active, archived, deleted, directory_missing]
        statusDetail: { type: string }
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt:
          type: string
          description: When the team was archived (RFC 3339); absent unless archived.
        permissionMode:
          type: string
          enum: [read_only, default, full]
          description: How freely members may act; mapped onto the engine's approval and sandbox settings.
        reasoningEffort:
          type: string
          description: How hard members think each turn; absent follows the model's default.
        providerId:
          type: string
          description: The model provider this team runs with; absent follows the profile's default.
    Bot:
      type: object
      required: [id, teamId, name, roleId, isLeader, status, revision, createdAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        name: { type: string }
        roleId: { type: string }
        roleVersion: { type: string }
        isLeader: { type: boolean }
        status:
          type: string
          enum: [idle, queued, working, waiting_approval, waiting_input, interrupted, unknown]
        currentRunId: { type: string }
        avatar: { $ref: "#/components/schemas/AvatarRef" }
        providerId:
          type: string
          description: The provider of the model this member chose; absent means the member follows the default model.
        model:
          type: string
          description: The model this member chose, one its provider serves.
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        lastMessage: { $ref: "#/components/schemas/MessagePreview" }
    MessagePreview:
      type: object
      description: The start of the latest message between the user and a member, for the team list.
      required: [kind, text, createdAt]
      properties:
        kind: { type: string, enum: [user, assistant] }
        text: { type: string }
        createdAt: { type: string, format: date-time }
    TeamWithBots:
      type: object
      required: [team, bots]
      properties:
        team: { $ref: "#/components/schemas/Team" }
        bots:
          type: array
          items: { $ref: "#/components/schemas/Bot" }
    ApprovalOption:
      type: object
      required: [id]
      properties:
        id: { type: string }
        messageKey: { type: string }
        text: { type: string }
        disabled: { type: boolean }
        disabledReasonKey: { type: string }
    ApprovalDecision:
      type: object
      required: [optionId, actor, decidedAt]
      properties:
        optionId: { type: string }
        comment: { type: string }
        actor: { type: string }
        decidedAt: { type: string, format: date-time }
    Approval:
      type: object
      required: [id, teamId, requesterBotId, type, summary, options, requestState, revision, createdAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        requesterBotId: { type: string }
        runId: { type: string }
        type: { type: string, enum: [native_tool, recovery, chain] }
        method: { type: string }
        summary: { type: string }
        reason: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/ApprovalOption" }
        requestState: { type: string, enum: [pending, decided, invalidated] }
        decision: { $ref: "#/components/schemas/ApprovalDecision" }
        responseState: { type: string, enum: [queued, sent, unknown, expired] }
        createdAt: { type: string, format: date-time }
        revision: { type: integer, format: int64 }
    Event:
      type: object
      required: [seq, id, instanceId, type, teamId, botId, resourceId, revision, payload, createdAt]
      properties:
        seq: { type: integer, format: int64 }
        id: { type: string }
        instanceId: { type: string }
        type: { type: string }
        teamId: { type: string }
        botId: { type: string }
        resourceId: { type: string }
        revision: { type: integer, format: int64 }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    TextBlock:
      type: object
      required: [type, text]
      properties:
        type: { type: string }
        text: { type: string }
    Run:
      type: object
      required: [id, teamId, botId, status, startedAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        botId: { type: string }
        providerSessionId: { type: string }
        providerTurnId: { type: string }
        engineEpoch: { type: string }
        status: { type: string, enum: [starting, running, waiting_approval, waiting_input, completed, failed, interrupted, unknown] }
        errorKey: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
    RunStep:
      type: object
      required: [id, runId, teamId, botId, seq, kind, status, detail, startedAt, updatedAt]
      properties:
        id: { type: string }
        runId: { type: string }
        teamId: { type: string }
        botId: { type: string }
        seq: { type: integer }
        kind:
          type: string
          enum: [reasoning, command, file_change, tool, web_search, plan, message, agent, diff, notice, retry]
          description: The engine's step kinds plus CoBot's notice (engine error/warning) and retry (reconnect attempt).
        status:
          type: string
          enum: [in_progress, completed, failed, declined, interrupted]
        detail:
          type: object
          additionalProperties: true
          description: Kind-specific payload.
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RunWithSteps:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [steps]
          properties:
            steps:
              type: array
              items: { $ref: "#/components/schemas/RunStep" }
    ConversationPage:
      type: object
      required: [messages, nextCursor, bot, queuedCount, activeRun, runs]
      properties:
        messages:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/Message" }
        nextCursor: { type: string }
        bot: { $ref: "#/components/schemas/Bot" }
        queuedCount: { type: integer }
        activeRun:
          allOf:
            - $ref: "#/components/schemas/Run"
          nullable: true
        runs:
          type: array
          description: Runs started between this page's messages, with their visible steps.
          items: { $ref: "#/components/schemas/RunWithSteps" }
    TaskDetail:
      type: object
      required: [task, evidence]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
    Model:
      type: object
      description: One engine model, reduced to non-secret identifier fields.
      properties:
        slug: { type: string }
        id: { type: string }
        displayName: { type: string }
        description: { type: string }
        family: { type: string }
        isDefault: { type: boolean }
        defaultReasoningEffort: { type: string, description: The effort the model uses when none is chosen. }
        reasoningEfforts:
          type: array
          items:
            type: object
            required: [effort, description]
            properties:
              effort: { type: string }
              description: { type: string }
